# Fly.io — fly launch --no-deploy --copy-config ثم الأوامر في docs/07-deployment.md
app = "safarna"            # غيّر الاسم إن كان مستخدمًا
primary_region = "fra"     # أقرب منطقة متاحة لدول الخليج وقت الكتابة؛ راجع قائمة المناطق الحالية

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DB_FILE = "/data/safarna.db"
  TRUST_PROXY = "1"

[[mounts]]
  source = "safarna_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1   # SQLite: جهاز واحد فقط، لا توسّع أفقي
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
