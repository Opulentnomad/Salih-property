<style>/* ثواني — واجهة ناعمة (Soft UI) */
:root{
  --ink:#12214A; --ink-2:#4A5A85; --line:rgba(255,255,255,.55);
  --glass:rgba(255,255,255,.42); --glass-2:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.72); --glass-in:rgba(255,255,255,.55);
  --glass-sh:0 10px 34px rgba(60,70,160,.18); --hi:inset 0 1px 0 rgba(255,255,255,.75);
  --base:#E9EEFF; --b1:#FF9ACB; --b2:#7DB2FF; --b3:#8FEBC8; --b4:#C9B8FF;
  --sheet:transparent; --card:var(--glass); --nav:var(--glass-2); --navy:rgba(255,255,255,.4); --navy-2:#3D4FD6;
  --red:#E5283A; --red-2:#FF5A64; --orange:#FF8A1F; --orange-2:#FFB347; --green:#0FA95C; --green-2:#3FD98B; --blue:#2F6BEB; --blue-2:#5C95FF; --amber:#F2A900;
  --warn:rgba(229,40,58,.13); --gold:rgba(242,169,0,.2); --gold-line:rgba(214,140,0,.55); --glow:rgba(229,40,58,.4); --focus:#2F6BEB;
  --f:'Tajawal','Cairo',system-ui,sans-serif; --scale:1; color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--base);color:var(--ink);font-size:calc(17px*var(--scale));line-height:1.7;display:grid;place-items:center}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
.app{position:relative;width:100%;max-width:440px;height:100dvh;background:var(--sheet);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:560px){.app{height:min(880px,calc(100dvh - 32px));border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 8px rgba(255,255,255,.08)}}
.shell{display:flex;flex-direction:column;flex:1;min-height:0}

/* ---------- header ---------- */
.hdr{background:linear-gradient(180deg,var(--navy),var(--navy-2));color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 62px;flex:none}
.hdr.slim{padding-bottom:50px}
.hrow{display:flex;align-items:center;gap:10px;min-height:44px}
.hrow h1,.hrow h2{font-size:calc(22px*var(--scale));font-weight:800;flex:1}
.hrow h2{font-size:calc(19px*var(--scale))}
.ib{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;flex:none}
.ib:hover{background:rgba(255,255,255,.22)}
.ib svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;background:rgba(20,184,102,.22);color:#7DF0B8;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.off{background:rgba(242,169,0,.25);color:#FFD27A}
.search{margin-top:10px;position:relative}
.search input{width:100%;height:50px;border:0;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;padding:0 48px 0 52px;font-size:calc(16px*var(--scale))}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search input:focus{background:rgba(255,255,255,.2);outline:2px solid #fff}
.search .mag{position:absolute;inset-block:0;inset-inline-start:14px;display:grid;place-items:center;color:rgba(255,255,255,.8)}
.search .mic{position:absolute;inset-block:0;inset-inline-end:6px;width:42px;display:grid;place-items:center;color:#fff;border-radius:12px}
.search .mic.on{background:var(--red);animation:pulse 1s infinite}
.search svg{width:20px;height:20px}

/* ---------- content sheet ---------- */
.main{flex:1;min-height:0;overflow-y:auto;background:var(--sheet);margin-top:-34px;border-radius:30px 30px 0 0;padding:20px 16px 24px;position:relative;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:0}
.sec{font-size:calc(19px*var(--scale));font-weight:800;margin:22px 0 10px}
.sec:first-child{margin-top:0}
.sub{color:var(--ink-2);font-size:calc(14px*var(--scale))}

/* ---------- SOS ---------- */
.sos-wrap{display:grid;place-items:center;margin-top:-6px}
.sos{position:relative;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--red-2),var(--red) 60%,#A8141F);color:#fff;font-weight:900;line-height:1.25;font-size:calc(20px*var(--scale));box-shadow:0 12px 30px var(--glow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sos small{font-size:calc(15px*var(--scale));font-weight:700;opacity:.95}
.sos b{font-size:calc(30px*var(--scale));font-variant-numeric:tabular-nums}
.sos::before,.sos::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--red);opacity:0;animation:ring 2.4s infinite}
.sos::after{animation-delay:1.2s}
.sos:active{transform:scale(.96)}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@keyframes pulse{50%{opacity:.7}}

/* ---------- cat cards ---------- */
.cats{display:grid;gap:12px}
.cat{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;text-align:start;min-height:96px;padding:14px 16px;border-radius:22px;color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.14);transition:transform .15s}
.cat:active{transform:scale(.98)}
.cat::after{content:"";position:absolute;inset-inline-start:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.cat .t{flex:1;position:relative;z-index:1}
.cat h3{font-size:calc(20px*var(--scale));font-weight:800;line-height:1.3}
.cat p{font-size:calc(14px*var(--scale));opacity:.92}
.cat .badge{display:inline-block;margin-top:6px;background:rgba(255,255,255,.9);color:var(--ink);font-weight:800;font-size:12px;padding:1px 10px;border-radius:99px}
.cat .ic{position:relative;z-index:1;width:64px;height:64px;flex:none}
.g-red{background:linear-gradient(135deg,#E5283A,#FF6A5F)}
.g-orange{background:linear-gradient(135deg,#FF8A1F,#FFB347)}
.g-green{background:linear-gradient(135deg,#0FA95C,#3FD98B)}
.g-blue{background:linear-gradient(135deg,#2F6BEB,#5C95FF)}
.g-teal{background:linear-gradient(135deg,#0E8A9B,#38C7C0)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;min-height:42px;font-size:calc(15px*var(--scale))}
.chip[aria-pressed=true]{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qk{display:flex;align-items:center;gap:10px;text-align:start;background:var(--card);border-radius:16px;padding:10px;min-height:70px;font-weight:800;line-height:1.3;font-size:calc(15px*var(--scale));box-shadow:0 4px 14px rgba(20,32,63,.07);border:2px solid transparent}
.qk:active{border-color:var(--lv)}
.qk .pic{width:42px;height:42px}

/* ---------- list rows ---------- */
.rows{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 12px;text-align:start;min-height:70px;box-shadow:0 4px 14px rgba(20,32,63,.07)}
.row .pic{width:48px;height:48px}
.row .tx{flex:1;min-width:0;font-weight:800;line-height:1.35;font-size:calc(16px*var(--scale))}
.row .tx small{display:block;font-weight:500;color:var(--ink-2);font-size:calc(13px*var(--scale))}
.row .ph{font-weight:900;font-size:calc(15px*var(--scale));padding:2px 12px;border-radius:99px;color:#fff;background:var(--lv)}
.empty{padding:26px;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--ink-2)}

/* ---------- level colours / pictogram ---------- */
.lv-c{--lv:var(--red);--lv2:var(--red-2)}.lv-d{--lv:#B3182B;--lv2:#E5283A}.lv-w{--lv:#E98A00;--lv2:#FFC04D}
.lv-t{--lv:var(--blue);--lv2:var(--blue-2)}.lv-p{--lv:var(--green);--lv2:var(--green-2)}
.pic{display:grid;place-items:center;flex:none;aspect-ratio:1;border-radius:30%;background:linear-gradient(135deg,var(--lv),var(--lv2));color:#fff}
.pic svg{width:56%;height:56%;display:block}

/* ---------- guide ---------- */
.modes{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.modes button{flex:1;min-height:42px;border-radius:11px;font-weight:800;color:var(--ink-2)}
.modes button[aria-selected=true]{background:var(--navy-2);color:#fff}
.stage{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 10px 26px rgba(20,32,63,.1);touch-action:pan-y}
.art{position:relative;height:190px;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--lv) 14%,var(--card)),color-mix(in srgb,var(--lv2) 30%,var(--card)));display:grid;place-items:center;overflow:hidden}
.art .pic{width:112px;height:112px;box-shadow:0 12px 26px color-mix(in srgb,var(--lv) 45%,transparent);animation:float 3.2s ease-in-out infinite}
.art .cap{position:absolute;bottom:10px;inset-inline:0;text-align:center;font-weight:800;font-size:calc(14px*var(--scale));color:var(--ink-2)}
@keyframes float{50%{transform:translateY(-6px)}}
.wave{position:absolute;bottom:34px;inset-inline:20px;height:26px;display:flex;align-items:center;justify-content:center;gap:3px;opacity:0;transition:opacity .2s}
.wave.on{opacity:1}
.wave i{width:4px;height:6px;border-radius:3px;background:var(--lv);animation:eq .8s ease-in-out infinite}
.wave i:nth-child(3n){animation-delay:.15s}.wave i:nth-child(3n+1){animation-delay:.3s}.wave i:nth-child(4n){animation-delay:.45s}
@keyframes eq{50%{height:24px}}
.stepno{margin-top:14px;color:var(--lv);font-weight:900;font-size:calc(15px*var(--scale))}
.steptx{margin-top:2px;font-size:calc(22px*var(--scale));font-weight:800;line-height:1.55;min-height:6.2em}
.steptx.gold{background:var(--gold);border:2px solid var(--gold-line);border-radius:16px;padding:12px 14px;font-size:calc(19px*var(--scale));min-height:0;margin-top:8px}
.bar{display:flex;gap:5px;margin-top:14px}
.bar i{flex:1;height:7px;border-radius:5px;background:var(--line);transition:background .2s}
.bar i.on{background:var(--lv)}
.ctl{display:grid;grid-template-columns:52px 1fr 1.2fr;gap:10px;margin-top:14px;align-items:stretch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;font-weight:800;padding:0 16px;text-decoration:none;font-size:calc(17px*var(--scale))}
.btn svg{width:20px;height:20px}
.btn.blue{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff}
.btn.green{background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--green) 40%,transparent)}
.btn.red{background:linear-gradient(135deg,var(--red),var(--red-2));color:#fff}
.btn.ghost{background:var(--card);border:2px solid var(--line)}
.btn.sm{min-height:42px;font-size:calc(15px*var(--scale));border-radius:13px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.act{margin-top:12px;display:grid;gap:8px}
.done h3{font-size:calc(22px*var(--scale));font-weight:900;margin-top:6px}
.avoid{background:var(--warn);border-radius:16px;padding:12px 16px;margin-top:12px}
.avoid h3{color:var(--red);font-size:calc(17px*var(--scale));margin:0 0 4px}
.avoid ul{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-weight:500}

/* full card (triage tag) */
.tag{--cut:26px;background:var(--card);clip-path:polygon(0 var(--cut),var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%);overflow:hidden}
.tagwrap{filter:drop-shadow(0 8px 16px rgba(20,32,63,.18))}
.th{position:relative;background:linear-gradient(135deg,var(--lv),var(--lv2));color:#fff;padding:42px 18px 18px}
.hole{position:absolute;top:13px;left:50%;translate:-50% 0;width:18px;height:18px;border-radius:50%;background:var(--sheet);box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.th small{font-weight:700;opacity:.95}
.th h2{font-size:calc(23px*var(--scale));font-weight:900;margin-top:2px;line-height:1.4}
.th p{margin-top:4px;font-weight:600;opacity:.95}
.call{display:inline-flex;flex-direction:column;align-items:center;margin-top:12px;background:#fff;color:#14203F;border-radius:14px;padding:4px 20px;text-decoration:none;min-width:120px}
.call small{color:#5B6785;font-size:12px}.call b{font-size:34px;line-height:1.15;color:var(--lv);font-variant-numeric:tabular-nums}
.tb{padding:16px 18px;display:grid;gap:14px}
.gold{background:var(--gold);border:2px solid var(--gold-line);border-radius:16px;padding:10px 14px;font-weight:600}
.gold h3{font-size:15px;color:#9A6A00;margin-bottom:2px}
.stp{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.stp li{display:flex;gap:10px;align-items:flex-start;background:var(--sheet);border-radius:14px;padding:10px}
.stp li::before{counter-increment:s;content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--lv);color:#fff;display:grid;place-items:center;font-weight:900}
.gear{background:var(--sheet);border-radius:16px;padding:10px 14px}
.gear h3,.tb h3.h{font-size:calc(17px*var(--scale));font-weight:800;margin-bottom:6px}
.gear label{display:flex;gap:10px;align-items:flex-start;padding:3px 0;cursor:pointer}
.gear input{width:20px;height:20px;margin-top:6px;accent-color:var(--green);flex:none}
.tf{border-top:3px dashed var(--line);background:var(--sheet);padding:12px 18px 18px;display:grid;gap:2px;font-size:calc(14px*var(--scale))}
.tf em{font-style:normal;color:var(--ink-2)}
.xr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

/* ---------- CPR ---------- */
.cprhdr{background:linear-gradient(180deg,#0A0E1C,#141A33)}
.heart{position:relative;display:grid;place-items:center;height:210px;border-radius:24px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--red) 22%,transparent),transparent 65%),var(--card);overflow:hidden}
.heart svg.h{width:120px;height:120px;transition:transform .1s;filter:drop-shadow(0 0 16px var(--glow))}
.heart.beat svg.h{transform:scale(1.22)}
.ecg{position:absolute;inset-inline:0;top:50%;translate:0 -50%;width:100%;height:80px;pointer-events:none}
.ecg path{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;opacity:.9}
.heart.run .ecg path{animation:dash 1.64s linear infinite}
@keyframes dash{to{stroke-dashoffset:-400}}
.press{width:100%;min-height:74px;margin-top:14px;border-radius:22px;font-weight:900;font-size:calc(26px*var(--scale));color:#fff;background:linear-gradient(90deg,var(--red),var(--green));box-shadow:0 10px 26px var(--glow)}
.press.on{background:linear-gradient(90deg,#444C6B,#2B3250);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 14px rgba(20,32,63,.07)}
.stat b{display:block;font-size:calc(28px*var(--scale));font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:calc(13px*var(--scale));color:var(--ink-2)}
.alert{margin-top:12px;background:var(--gold);border:2px solid var(--gold-line);border-radius:16px;padding:10px 14px;font-weight:700}
.panel{background:var(--card);border-radius:22px;padding:16px;margin-top:16px;box-shadow:0 4px 14px rgba(20,32,63,.07)}
.clock{font-size:calc(46px*var(--scale));font-weight:900;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;margin:6px 0 0}
.since{text-align:center;color:var(--ink-2);min-height:26px;font-size:calc(14px*var(--scale))}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

/* ---------- forms ---------- */
.fld{display:grid;gap:4px;margin-bottom:12px;font-weight:800}
.fld input,.fld textarea{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:50px;font-weight:500;width:100%}
.fld input:focus,.fld textarea:focus{border-color:var(--blue);outline:none}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:11px;font-weight:800;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--navy-2);color:#fff}
.box{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(20,32,63,.07)}

/* ---------- refs ---------- */
.ref{background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:8px;border:2px solid transparent}
.ref:target{border-color:var(--red)}
.ref a{font-weight:800;text-underline-offset:3px}
.ref .n{color:var(--red);font-weight:900;margin-inline-end:6px}
.ref small{display:block;color:var(--ink-2);font-size:calc(14px*var(--scale))}
.ref .u{direction:ltr;text-align:end;font-size:12px;color:var(--ink-2)}
.disc{background:var(--gold);border:2px solid var(--gold-line);border-radius:16px;padding:12px 14px;margin-top:10px;font-weight:500}
.fact{border-inline-start:5px solid var(--red);background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-weight:600}
.fact a{color:var(--red);font-weight:900;text-decoration:none}

/* ---------- bottom nav ---------- */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--nav);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(20,32,63,.12);position:relative}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0;min-height:54px;justify-content:center;color:var(--ink-2);font-size:12px;font-weight:700;border-radius:14px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--blue)}
.hdr .ib[style*="--red"] b{padding:0 4px}
.nav .mid{position:relative;top:-20px;min-height:0;height:62px;width:62px;margin-inline:auto;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red-2));color:#fff!important;box-shadow:0 8px 20px var(--glow);justify-content:center}
.nav .mid svg{width:30px;height:30px}

/* ---------- welcome ---------- */
.welcome{position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#FFE6F4 0%,#EEF0FF 60%,#E6ECFF 100%);color:#14203F;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.skip{align-self:flex-start;color:#5B6785;font-weight:700;min-height:44px;padding:0 6px}
.slides{flex:1;display:flex;overflow:hidden;touch-action:pan-y}
.slide{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .35s}
.slide svg{width:min(250px,60%);height:auto;filter:drop-shadow(0 14px 18px rgba(20,32,63,.2))}
.slide h2{font-size:30px;font-weight:900;line-height:1.35}
.slide p{color:#5B6785;font-size:18px;max-width:22ch}
.dots{display:flex;justify-content:center;gap:8px;margin:10px 0 16px}
.dots i{width:9px;height:9px;border-radius:50%;background:#C6CDE6;transition:all .25s}
.dots i.on{width:26px;border-radius:6px;background:var(--navy-2)}
.go{align-self:center;min-width:180px;min-height:60px;border-radius:30px;background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;font-weight:900;font-size:22px;box-shadow:0 12px 26px rgba(20,184,102,.4)}

/* ---------- sheet (SOS) ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(5,8,20,.6);display:flex;align-items:flex-end;animation:fade .2s}
.sheetp{width:100%;background:var(--sheet);border-radius:28px 28px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out;max-height:92%;overflow-y:auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheetp h2{font-size:22px;font-weight:900;margin-bottom:10px}
.nums{display:grid;gap:8px}
.numr{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--card);border-radius:18px;padding:10px 14px;min-height:64px;box-shadow:0 4px 14px rgba(20,32,63,.07)}
.numr b{font-size:30px;font-weight:900;color:#fff;background:var(--c);border-radius:14px;padding:0 14px;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.numr span{font-weight:800;line-height:1.3}.numr small{display:block;font-weight:500;color:var(--ink-2)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* ---------- toast / dialog ---------- */
#toasts{position:absolute;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:#14203F;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:fade .2s}
.toast.err{background:var(--red)}
dialog{border:0;border-radius:20px;padding:18px;width:min(420px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog input{width:100%;margin:10px 0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;direction:ltr;background:var(--sheet);color:var(--ink)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- print: the card only ---------- */
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;display:block}
  .app{height:auto;max-width:none;box-shadow:none;border-radius:0;overflow:visible;position:static}
  .main{overflow:visible;margin:0;padding:0}
  body *{visibility:hidden}
  #tagwrap,#tagwrap *{visibility:visible}
  #tagwrap{position:absolute;left:0;top:0;width:100%;filter:none}
  .tag{clip-path:none;border:1px solid #888}
  .th,.stp li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* guide controls: keep labels on one line */
.ctl .btn{padding:0 8px;font-size:calc(15px*var(--scale));white-space:nowrap}
.btn svg{flex:none}


/* =====================  GLASS LAYER  ===================== */
.app{background:var(--base)}

/* shared frosted surface */
.chip,.qk,.row,.stage,.stat,.panel,.box,.ref,.fact,.numr,.modes,.seg,.empty,.disc,dialog,.btn.ghost,.hdr,.nav,.sheetp,.search input,.fld input,.fld textarea,.tag,.ib,.toast{
  -webkit-backdrop-filter:blur(20px) saturate(165%);backdrop-filter:blur(20px) saturate(165%)}
.chip,.qk,.row,.stage,.stat,.panel,.box,.ref,.fact,.numr,.modes,.seg,.empty,.disc{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--hi),var(--glass-sh)}
.row,.qk{-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.stage{border-radius:28px}
.empty{border-style:solid}

/* header & nav float over scrolling content */
.hdr,.hdr.slim{position:absolute;top:0;inset-inline:0;z-index:6;padding-bottom:12px;color:var(--ink);background:var(--glass-2);border-bottom:1px solid var(--glass-b);box-shadow:var(--hi),0 8px 30px rgba(20,30,90,.12)}
.hdr.cprhdr{background:var(--glass-2)}
.main{position:absolute;inset:0;margin:0;border-radius:0;background:transparent;padding-top:calc(var(--hh,130px) + 16px);padding-bottom:calc(var(--nh,72px) + 28px)}
.nav{position:absolute;bottom:0;inset-inline:0;z-index:6;background:var(--glass-2);border-top:1px solid var(--glass-b);box-shadow:var(--hi),0 -8px 30px rgba(20,30,90,.12)}
.nav button[aria-current=page]{color:var(--blue)}
.ib{background:var(--glass-in);color:var(--ink);border:1px solid var(--glass-b);box-shadow:var(--hi)}
.ib:hover{background:var(--glass-2)}
.hrow h1,.hrow h2{color:var(--ink)}
.search input{background:var(--glass-in);color:var(--ink);border:1px solid var(--glass-b);box-shadow:var(--hi)}
.search input::placeholder{color:var(--ink-2)}
.search input:focus{background:var(--glass-2);outline:2px solid var(--blue)}
.search .mag,.search .mic{color:var(--ink-2)}
.pill{background:color-mix(in srgb,var(--green) 18%,transparent);color:color-mix(in srgb,var(--green) 80%,var(--ink));border:1px solid color-mix(in srgb,var(--green) 35%,transparent)}
.pill.off{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--ink)}

/* SOS: a glass orb */
.sos{background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.9) 0,rgba(255,150,160,.75) 16%,rgba(229,40,58,.82) 52%,rgba(140,10,28,.92) 100%);
  border:1px solid rgba(255,255,255,.55);

  'اجعل المصاب يستلقي على ظهره مع رفع ساقيه للأعلى، أو في وضع الجلوس المريح إذا كان يعاني من ضيق تنفس شديد.',
  'فكّ الملابس الضيقة حول الرقبة والصدر وراقب التنفس ومستوى الوعي باستمرار.',
  'إذا لم تتحسن الأعراض خلال 5 إلى 15 دقيقة وتوفر قلم ثانٍ، يمكن إعطاء جرعة ثانية في الفخذ الآخر.'],
 ['لا تكتفِ بمضادات الهيستامين الفموية في حالات تورم الحلق أو ضيق التنفس لأنها بطيئة المفعول.',
  'لا تجعل المصاب يقف فجأة أثناء الصدمة التحسسية لأن ذلك قد يسبب هبوطاً حاداً وتوقفاً للقلب.',
  'لا تحقن قلم الإبينفرين في الوريد أو الأصابع أو الأرداف؛ المكان الآمن الوحيد هو العضلة الخارجية للفخذ.'],
 ['علامات التفريق الحاسمة: الحساسية العادية تقتصر على حكة/طفح، بينما الصدمة تشمل جهازين أو أكثر (تنفس، ضغط، بلع).',
  'الاحتفاظ بالقلم المستعمل لتسليمه لطاقم الإسعاف وتحديد وقت الحقن.']),

P('first_aid','الاشتباه بالنوبة القلبية أو الجلطة الدماغية (قاعدة FAST)','997','حرج — عامل الوقت ينقذ الدماغ والقلب','d',
 'في الجلطة الدماغية: احفظ وقت ظهور أول عرض بدقة بالدقيقة؛ فالعلاجات المذيبة للجلطة تعتمد كلياً على نافذة الوقت منذ بداية الأعراض.',
 ['للجلطة الدماغية طبّق فحص (FAST): اطلب منه الابتسام (هل الفم مائل؟)، رفع الذراعين (هل تسقط إحداهما؟)، نطق جملة بسيطة (هل الكلام متلعثم؟).',
  'للنوبة القلبية: انتبه لألم أو ضغط عاصر في منتصف الصدر يمتد للذراع الأيسر أو الفك أو الظهر مع تعرق بارد وغثيان.',
  'اتصل فوراً بـ 997 ولا تنتظر زوال الأعراض تلقائياً.',
  'اجعل المصاب في وضع نصف جالس مريح (ظهره مسنود وركبتاه مثنيتان قليلاً) لتقليل العبء على القلب، وهدّئ من روعه.',
  'في النوبة القلبية فقط (إذا كان المصاب واعياً ولا يعاني من حساسية للأسبرين أو نزيف): أعطه قرص أسبرين (300 ملجم) ليمضغه ببطء بعد استشارة 997/937.'],
 ['لا تعطِ الأسبرين أبداً لمن يشتبه بإصابته بجلطة دماغية (لأنها قد تكون ناتجة عن نزيف دماغي).',
  'لا تعطِ مصاب الجلطة الدماغية أي طعام أو شراب أو دواء عن طريق الفم لاحتمال شلل عضلات البلع.',
  'لا تجعل المصاب يمشي أو يبذل أي مجهود بدني أو يقود سيارته بنفسه للمستشفى.'],
 ['تدوين الدقيقة والساعة التي شوهد فيها المصاب طبيعياً لآخر مرة، وتجهيز قائمة أدويته المعتادة.']),

P('first_aid','الإسعاف الأولي للحروق الحرارية والكيميائية','997','تدخل إسعافي فوري لتقليل تلف الأنسجة','w',
 'التبريد الفوري بماء الصنبور الجاري الفاتر (وليس المثلج) لمدة 15 إلى 20 دقيقة متواصلة هو أهم خطوة لإيقاف امتداد الحرق لطبقات الجلد العميقة.',
 ['أبعد المصاب فوراً عن مصدر الحرارة أو اللهب أو السائل الساخن.',
  'ضع المنطقة المحروقة تحت ماء جارٍ معتدل البرودة لمدة 15 إلى 20 دقيقة متواصلة.',
  'انزع الخواتم، الساعات، الأساور، والأحزمة برفق قبل أن تبدأ المنطقة بالتورم.',
  'غطِّ الحرق بشكل غير ضاغط بشاش طبي معقم غير لاصق أو بغلاف بلاستيكي نظيف (نايلون تغليف الطعام) لحمايته من الهواء والعدوى.',
  'اطلب الرعاية الطبية فوراً إذا كان الحرق في الوجه أو اليدين أو المفاصل أو كان أكبر من حجم كف يد المصاب.'],
 ['لا تضع معجون الأسنان أو البن أو الدقيق أو الزبدة أو البيض أو الثلج المباشر على الحرق أبداً.',
  'لا تقم بثقب أو فقء الفقاعات المائية المتكونة فوق الحرق لأنها تحمي الجلد التحتي من البكتيريا.',
  'لا تنزع الملابس الملتصقة بالجلد المحروق بالقوة، بل قصّ القماش حولها واترك الجزء الملتصق للطبيب.'],
 ['في الحروق الكيميائية (المنظفات القوية/الأسيد): اغسل بالماء الجاري لمدة 20-30 دقيقة مع إبعاد الملابس الملوثة.']),

P('first_aid','طوارئ هبوط وارتفاع السكر الحاد (قاعدة 15-15)','997','طوارئ أيضية — خطر فقدان الوعي','w',
 'إذا اشتبهت بهبوط السكر ولم يتوفر جهاز فحص، عالجه فوراً كأنه هبوط سكر؛ فهبوط السكر الحاد يهدد الدماغ خلال دقائق بينما الارتفاع المؤقت أقل خطورة.',
 ['إذا كان المصاب واعياً ويستطيع البلع بأمان: طبّق (قاعدة 15) بإعطائه 15 جراماً من السكر سريع الامتصاص (نصف كوب عصير محلى، أو ملعقة كبيرة عسل/سكر مذاب في ماء).',
  'انتظر 15 دقيقة في وضع الراحة، ثم أعد قياس السكر؛ إذا ظل أقل من 70 ملجم/ديسيلتر كرر إعطائه 15 جراماً أخرى.',
  'بمجرد ارتفاع السكر فوق 70 وتحسن الأعراض: أعطه وجبة خفيفة تحتوي على نشويات وبروتين (مثل شطيرة جبن أو تمر مع لبن) لمنع تكرار الهبوط.',
  'إذا كان المصاب فاقداً للوعي أو عاجزاً عن البلع: ضعه في وضعية الإفاقة على جانبه واتصل بـ 997 فوراً.',
  'إذا توفرت حقنة الجلوكاجون الطارئة أو بخاخ الجلوكاجون الأنفي وكنت مدرباً عليها، استخدمها فوراً للمصاب الغائب عن الوعي.'],
 ['لا تحاول سكب العصير أو الماء أو وضع الطعام في فم مريض السكر الغائب عن الوعي حتى لا يختنق.',
  'لا تعطِ الشوكولاتة أو الحليب كامل الدسم كخيار أول لرفع السكر السريع لأن الدهون تبطئ امتصاص السكر.',
  'لا تحقن الإنسولين أبداً لمريض فاقد للوعي لأن ذلك قد يكون قاتلاً إذا كانت الحالة هبوطاً بالسكر.'],
 ['أعراض الهبوط: رجفة، تعرق بارد غزير، شحوب، جوع شديد، تسارع نبض، تشوش ذهني أو عصبية مفاجئة.']),

P('first_aid','نوبات التشنج والصرع','997','حماية المصاب من الإصابات وتأمين التنفس','t',
 'خرافة (بلع اللسان) غير صحيحة علمياً أثناء التشنج؛ لا تفتح فم المصاب بالقوة ولا تضع أي أداة أو إصبع داخل فمه أبداً.',
 ['حافظ على هدوئك، واحسب وقت بدء النوبة بالساعة، وأبعد الأثاث أو الأدوات الحادة من حول المصاب.',
  'ضع وسادة أو قطعة ملابس مطوية ناعمة تحت رأس المصاب لحمايته من الارتطام بالأرض.',
  'فكّ أزرار الياقة أو ربطة العنق أو النظارة لتسهيل التنفس.',
  'بمجرد انتهاء الحركات التشنجية: أدر المصاب برفق على أحد جانبيه (وضعية الإفاقة) ليخرج اللعاب ويبقى مجرى الهواء مفتوحاً.',
  'ابقَ بجانبه وتحدث معه بهدوء حتى يستعيد وعيه الكامل، واتصل بـ 997 إذا استمرت النوبة أكثر من 5 دقائق.'],
 ['لا تثبّت المصاب بالقوة ولا تحاول إيقاف حركات أطرافه أثناء التشنج لتجنب كسر العظام أو خلع المفاصل.',
  'لا تضع ملعقة أو قماشاً أو أصابعك في فم المصاب تحت أي ظرف.',
  'لا تعطِ المصاب ماءً أو دواءً أو طعاماً إلا بعد أن يستيقظ تماماً ويعود لوعيه الكامل.'],
 ['الحالات التي تستوجب الإسعاف الفوري (997): استمرار النوبة أكثر من 5 دقائق، أو تكرر نوبتين متتاليتين دون إفاقة، أو حدوثها لأول مرة.']),

P('first_aid','الكسور وإصابات الرأس والعمود الفقري','997','حرج — منع المضاعفات العصبية والشلل','t',
 'عند الشك بإصابة في الرأس أو الرقبة أو الظهر (بعد سقوط من علو أو حادث مروري): لا تحرّك المصاب أبداً إلا إذا كان هناك خطر فوري كحريق.',
 ['ثبّت رأس ورقبة المصاب في نفس وضعيتها بوضع يديك على جانبي رأسه لمنع أي التفات ريثما يصل الهلال الأحمر (997).',
  'للكسور في الأطراف: لا تحاول إرجاع العظم المكسور إلى مكانه؛ ثبّت الطرف في الوضع الذي وجدته عليه باستخدام جبيرة مؤقتة (كرتون مقوى أو لوح خشبي مبطن).',
  'إذا كان الكسر مفتوحاً (خروج العظم من الجلد): غطِّ الجرح بشاش معقم واضغط حول حواف الجرح للسيطرة على النزيف دون الضغط على العظم البارز.',
  'ضع كمادات باردة ملفوفة بقماش فوق منطقة الكسر المغلق لتقليل التورم والألم.',
  'افحص النبض والإحساس ولون الأصابع في الطرف المصاب قبل وبعد وضع الجبيرة للتأكد من عدم شدها أكثر من اللازم.'],
 ['لا تنقل مصاب الحوادث أو السقوط في سيارة خاصة بطريقة عشوائية قد تقطع الحبل الشوكي.',
  'لا تنزع خوذة سائق الدراجة المصاب إلا إذا كان لا يتنفس واستحال فتح مجرى الهواء.'],
 ['علامات ارتجاج الدماغ الخطيرة: قيء متكرر، تفاوت حجم حدقتي العين، خروج سائل شفاف أو دم من الأذن/الأنف، ميل شديد للنوم.']),

P('first_aid','نزيف الأنف الحاد (الرعاف)','937','إسعاف أولي شائع — تصحيح الخطأ الشائع','p',
 'أمِل الرأس للأمام قليلاً وليس للخلف أبداً؛ فإرجاع الرأس للخلف يجعل الدم ينزل للحلق والمعدة مما يسبب القيء أو الاختناق.',
 ['أجلس المصاب في وضع مستقيم مع إمالة رأسه للأمام قليلاً واطلب منه التنفس بهدوء عن طريق الفم.',
  'اضغط بإصبعي الإبهام والسبابة على الجزء الغضروفي اللين من الأنف (أسفل العظمة مباشرة) بقوة وثبات.',
  'استمر بالضغط المتواصل لمدة 10 إلى 15 دقيقة كاملة حسب الساعة دون رفع أصابعك كل دقيقة للتأكد.',
  'ضع كمادة باردة أو كيس ثلج ملفوفاً بقماش فوق جسر الأنف والجبهة للمساعدة في انقباض الأوعية الدموية.',
  'بعد توقف النزيف، اطلب من المصاب عدم التمخط أو فرك الأنف أو الانحناء لعدة ساعات.'],
 ['لا تُرجع رأس المصاب للخلف ولا تجعله يستلقي على ظهره أثناء الرعاف.',
  'لا تحشُ الأنف بالمناديل الورقية أو القطن الجاف لأنه يلتصق بالجلطة الدموية ويعيد فتح الجرح عند سحبه.'],
 ['راجع الطوارئ فوراً إذا استمر النزيف أكثر من 20 دقيقة رغم الضغط الصحيح، أو إذا كان المصاب يتناول مسيلات الدم.']),

P('first_aid','إصابات العين والمواد الكيميائية','997','طوارئ عيون — الغسل الفوري وعدم الفرك','w',
 'في إصابات العين الكيميائية: اغسل العين فوراً بماء الصنبور الجاري لمدة 15-20 دقيقة متواصلة؛ وفي الأجسام المغروسة: لا تفرك العين ولا تسحب الجسم المغروس أبداً.',
 ['عند دخول مادة كيميائية (منظف/معقم/كلور): افتح جفني العين برفق واغسلها بماء جارٍ فاتر لمدة 15 دقيقة بحيث يتدفق الماء من الزاوية الداخلية للخارجية (حتى لا تتلوث العين السليمة).',
  'انزع العدسات اللاصقة فوراً أثناء الغسل بالماء إذا كانت موجودة.',
  'عند وجود ذرة غبار سطحية: ارمش عدة مرات أو اغسل العين بمحلول ملحي معقم دون فركها.',
  'عند انغراس جسم صلب أو شظية في العين: لا تحاول إزالته أبداً؛ غطِّ العين المصابة بكوب ورقي مفرغ (حتى لا يضغط على الجفن) وغطِّ العين السليمة أيضاً لمنع حركة العينين معاً.',
  'توجه لطوارئ العيون فوراً أو اتصل بـ 997.'],
 ['لا تفرك العين المصابة بيدك تحت أي ظرف لأن الفرك يخدش القرنية بعمق.',
  'لا تستخدم قطرات عيون علاجية أو ملونة قبل فحص الطبيب.'],
 ['أخذ عبوة المادة الكيميائية أو تصويرها لإطلاع طبيب العيون على تركيبها الكيميائي.']),

P('first_aid','الإغماء المفاجئ ووضعية الإفاقة','997','إسعاف أولي — تأمين مجرى الهواء والتروية الدموية','p',
 'إذا كان الشخص فاقداً للوعي ولكنه يتنفس بشكل طبيعي، فإن وضعية الإفاقة (على الجانب) هي الوضع الآمن لمنع انسداد مجرى الهواء باللسان أو القيء.',
 ['افحص استجابة المصاب وتأكد أولاً أنه يتنفس طبيعياً (إذا كان لا يتنفس انتقل فوراً لبروتوكول الإنعاش القلبي CPR).',
  'إذا كان الإغماء بسيطاً وبدأ يستعيد وعيه سريعاً: دعه مستلقياً على ظهره وارفع ساقيه بزاوية 30 درجة لإعادة الدم للدماغ.',
  'فكّ الملابس الضيقة حول الرقبة والحزام، ووفّر تهوية جيدة في المكان.',
  'إذا استمر غيابه عن الوعي مع وجود تنفس طبيعي: ضعه في (وضعية الإفاقة) بإمالته على جانبه، ووضع يده العليا تحت خده، وثني ركبته العليا بزاوية قائمة.',
  'لا تسمح له بالوقوف السريع فور إفاقته؛ أبقِه جالساً لـ 10 دقائق، واتصل بـ 997 إذا لم يفق خلال دقيقة واحدة.'],
 ['لا تصفع وجه المصاب ولا ترش الماء البارد على وجهه ولا تقرب العطور النفاذة أو البصل من أنفه.',
  'لا ترفع رأس المصاب بوسادة عالية أثناء الإغماء لأن ذلك يقلل وصول الدم للدماغ.'],
 ['عند الشعور بدوخة ما قبل الإغماء: اجلس فوراً أو استلقِ وضع رأسك بين ركبتيك لتفادي السقوط والارتطام.']),

P('first_aid','الجروح القطعية العميقة أو بتر الإصبع','997','إسعاف جراحي عاجل — حفظ الجزء المبتور','d',
 'في حال بتر إصبع أو جزء من طرف: لا تضع الجزء المبتور مباشرة فوق الثلج أو في الماء أبداً؛ بل لفه بشاش رطب، ثم ضعه داخل كيس بلاستيكي محكم، ثم ضع الكيس في ماء وثلج.',
 ['اضغط مباشرة بقوة على الجرح النازف بشاش معقم وارفع الطرف المصاب فوق مستوى القلب.',
  'إذا كان هناك جسم مغروس في الجرح (قطعة زجاج كبيرة أو سكين): لا تسحبه أبداً لأن سحبه يسبب نزيفاً حاداً؛ ثبّته بلفائف شاش حوله واضغط على حواف الجرح.',
  'لحفظ الجزء المبتور (مثل إصبع): اشطفه بلطف بمحلول ملحي دون فركه، ولفه بشاش معقم مبلل قليلاً.',
  'ضع الجزء الملفوف داخل كيس بلاستيكي نظيف وأغلقه بإحكام، ثم ضع هذا الكيس داخل وعاء يحتوي على ماء بارد وثلج.',
  'اتصل بـ 997 وتوجه فوراً للمستشفى مع اصطحاب الجزء المبتور المحفوظ.'],
 ['لا تجعل الثلج يلامس الأنسجة المبتورة مباشرة حتى لا تتجمد الخلايا وتموت.',
  'لا تسحب السكين أو الزجاج المغروس بعمق في الجسم.'],
 ['كتابة اسم المصاب والوقت الدقيق للإصابة على الكيس الحافظ للجزء المبتور.']),

/* ---------- الفئة 2: الأطفال وكبار السن ---------- */
P('kids_elderly','غصة الرضع (أقل من سنة)','997','حرج جداً — بروتوكول خاص بالرضع','c',
 'للرضع أقل من عمر سنة: لا تضغط على البطن أبداً (ممنوع مناورة هيمليخ البطنية) لخطورة إصابة الكبد؛ استخدم 5 ضربات ظهرية + 5 ضغطات صدرية.',
 ['اجلس وضع الرضيع منبطحاً على وجهه فوق ساعدك (مع إسناد فكه ورأسه بكف يدك دون تغطية فمه) بحيث يكون رأسه أخفض من مستوى جسمه.',
  'وجّه 5 ضربات حاسمة بكعب يدك الأخرى في منتصف الظهر بين لوحي الكتف.',
  'إذا لم يخرج الجسم الغريب: اقلب الرضيع بحذر على ظهره فوق ساعدك الآخر مع بقاء رأسه منخفضاً.',
  'ضع إصبعين في منتصف صدر الرضيع (أسفل خط الحلمتين مباشرة) ووجّه 5 ضغطات صدرية سريعة بعمق 4 سم تقريباً.',
  'كرر التبديل بين (5 ضربات ظهرية و5 ضغطات صدرية) مع الاتصال بـ 997 حتى يخرج الجسم الغريب ويبدأ الرضيع بالبكاء أو التنفس.'],
 ['لا تضغط على بطن الرضيع تحت سن السنة أبداً.',
  'لا تمسك الرضيع من قدميه وتقلبه رأساً على عقب أو تهزه بعنف.'],
 ['علامات غصة الرضيع الخطيرة: ازرقاق الشفاه والوجه، عدم القدرة على البكاء أو إصدار صوت، ضعف الحركة.']),

P('kids_elderly','تسمم الأطفال بالمنظفات أو الأدوية أو البطاريات','937','طوارئ سموم — لا تجبر الطفل على القيء','c',
 'لا تجبر المصاب على التقيؤ أبداً (خصوصاً عند شرب المبيضات أو المنظفات الحارقة أو المشتقات النفطية) لأن المادة تحرق المريء مرة ثانية عند رجوعها.',
 ['أبعد المادة السامة عن الطفل فوراً، وافحص فمه لإزالة أي بقايا حبوب أو مسحوق بقطعة قماش مبللة.',
  'اتصل فوراً بمركز استشارات السموم بوزارة الصحة على الرقم (937) أو الإسعاف (997) إذا كانت هناك أعراض خطيرة.',
  'احتفظ بعلبة الدواء أو المنظف أمامك لإبلاغ الطبيب بالاسم العلمي الدقيق والتركيز والكمية التقديرية ووقت الابتلاع.',
  'إذا لامست المادة الكيميائية الجلد أو العين: اغسل المنطقة فوراً بماء الصنبور الجاري الفاتر لمدة 15 دقيقة.',
  'في حال ابتلاع بطارية دائرية صغيرة (Button Battery): توجه لأقرب طوارئ مستشفى فوراً لأنها تسبب حروقاً كهربائية للمريء خلال ساعتين.'],
 ['لا تدخل إصبعك في حلق الطفل لإحداث القيء ولا تعطه ماءً وملحاً.',
  'لا تعطِ الطفل حليباً أو ليموناً أو زيتاً لمعادلة المادة السامة إلا بتوجيه صريح من طبيب مركز السموم (937).'],
 ['تجهيز معلومات الطفل للطبيب: العمر، الوزن التقريبي، اسم المادة، الوقت منذ الابتلاع، الأعراض الحالية.']),

P('kids_elderly','سقوط كبار السن في المنزل','997','فحص دقيق قبل أي محاولة لرفع المصاب','w',
 'لا تتسرع برفع كبير السن من الأرض فور سقوطه؛ افحصه أولاً بهدوء وتأكد من عدم وجود كسر في الحوض أو الفخذ أو إصابة بالرأس.',
 ['هدّئ من روع المصاب، واطلب منه البقاء مكانه لبضع دقائق لالتقاط أنفاسه وتقييم حالته.',
  'اسأله عن وجود ألم شديد في الرأس أو الرقبة أو الظهر أو الورك، ولاحظ هل إحدى الساقين تبدو أقصر أو ملتفة للخارج (علامة كسر عنق الفخذ).',
  'إذا وجد ألم حاد في الورك/الظهر أو ضرب رأسه بقوة (خصوصاً إذا كان يتناول مسيلات دم): لا ترفعه أبداً، غطِّه ببطانية وضع وسادة تحت رأسه واتصل بـ 997.',
  'إذا تأكدت من سلامته تماماً وقدرته على تحريك أطرافه بدون ألم: قرّب كرسياً متيناً بجانبه، وساعده على الانقلاب لجانبه ثم الجلوس على يديه وركبتيه.',
  'اجعله يضع يديه على مقعد الكرسي ويرفع نفسه بركبته الأقوى ليجلس على الكرسي، ثم افحص ضغط دمه وسكره.'],
 ['لا تسحب كبير السن من ذراعيه أو تحت إبطيه لرفعه مباشرة من الأرض.',
  'لا تتجاهل ضربات الرأس البسيطة لدى كبار السن الذين يتناولون أدوية السيولة (راقبهم لمدة 48 ساعة).'],
 ['تجهيز المنزل الوقائي: مقابض إسناد في دورة المياه، فرش مانع للانزلاق، وإضاءة ليلية تلقائية في الممر.']),

P('kids_elderly','الغرق والإنقاذ المائي في المسابح والاستراحات','997','حرج جداً — تأمين التنفس الفوري','c',
 'في حالات الغرق يكون سبب توقف القلب هو نقص الأكسجين؛ لذا يبدأ الإنعاش بإعطاء 5 أنفاس إنقاذية أولاً ثم الضغطات الصدرية، ولا تضيع الوقت بمحاولة إخراج الماء من المعدة.',
 ['أخرج الغريق من الماء بأمان (مدّ له عصا أو طوق نجاة أولاً إذا كان واعياً) واطلب الاتصال الفوري بـ 997.',
  'ضع المصاب على ظهره فوق أرض صلبة بجانب المسبح، وافتح مجرى الهواء بإمالة الرأس للخلف ورفع الذقن بحذر.',
  'تحقق من التنفس خلال 10 ثوانٍ؛ إذا كان لا يتنفس: ابدأ فوراً بالإنعاش القلبي الرئوي (30 ضغطة صدرية متبوعة بنفسين إنقاذيين).',
  'إذا تقيأ المصاب الماء أثناء الإنعاش: أمل رأسه وجسمه للجانب لثوانٍ لخروج السوائل ثم أعده لوضع الظهر وواصل الإنعاش.',
  'انزع الملابس المبللة الباردة وغطِّ المصاب ببطانية جافة فور استعادته للوعي والتنفس.'],
 ['لا تضغط على بطن الغريق لإخراج الماء من رئتيه أو معدته؛ فهذا يؤخر الإنعاش ويسبب استنشاق القيء.',
  'لا تترك الطفل الذي تعرض لشبه غرق بدون فحص طبي بالمستشفى حتى لو بدا بخير (لخطر الغرق الثانوي خلال 24 ساعة).'],
 ['الغرق يحدث بصمت تام خلال أقل من 60 ثانية دون صراخ؛ المراقبة البصرية المباشرة للأطفال حول المسابح إلزامية.']),

P('kids_elderly','الحرارة الشديدة والتشنج الحراري للطفل','937','طوارئ أطفال — تبريد آمن وحماية مجرى الهواء','w',
 'لا تضع الطفل المصاب بالحمى أو التشنج الحراري في ماء بارد جداً أو ثلج أبداً، لأن ذلك يسبب انقباض الأوعية الدموية ويرفع حرارة الأعضاء الداخلية.',
 ['إذا حدث تشنج حراري للطفل: ضعه على سطح آمن مبطن على جانبه (وضعية الإفاقة) لمنع اختناقه باللعاب.',
  'خفف ملابس الطفل فوراً (اترك طبقة خفيفة واحدة) واحسب مدة التشنج بالساعة.',
  'لا تعطِ الطفل أي خافض حرارة أو ماء عن طريق الفم أثناء التشنج؛ انتظر حتى يتوقف التشنج ويستيقظ تماماً.',
  'استخدم كمادات ماء فاتر (بدرجة حرارة الغرفة) حول الرقبة وتحت الإبطين وبين الفخذين.',
  'راجع الطوارئ أو اتصل بـ 997 إذا استمر التشنج أكثر من 5 دقائق، أو إذا كان عمر الرضيع أقل من 3 أشهر وحرارته 38 درجة فأكثر.'],
 ['لا تستخدم الكحول الطبي أو الخل أو الماء المثلج لعمل كمادات للطفل.',
  'لا تعطِ الأسبرين للأطفال أبداً لخفض الحرارة.'],
 ['حساب جرعة خافض الحرارة بالمليجرام حسب وزن الطفل الدقيق وليس العمر فقط (عبر الاتصال بـ 937).']),

P('kids_elderly','فقدان طفل في الأماكن المزدحمة','911','استجابة فورية — الدقائق العشر الأولى حاسمة','c',
 'لا تبحث في صمت؛ ابدأ فوراً بـ (البحث بصوت عالٍ بالوصف وليس الاسم فقط): اذكر عمر الطفل ولون ملابسه بصوت مسموع ليلتفت كل من حولك خلال ثوانٍ.',
 ['توقف في مكانك لثوانٍ ونادِ بصوت مرتفع بوصف الطفل: (أبحث عن طفل عمره 5 سنوات يرتدي قميصاً أحمر!) فهذا يجعل جميع المتواجدين حولك عيوناً تبحث معك فوراً.',
  'أبلغ أقرب رجل أمن في المركز أو الساحة فوراً لإغلاق أو مراقبة البوابات والمخارج الرئيسية.',
  'ابقَ أنت (أو أحد الوالدين) في آخر نقطة شوهد فيها الطفل تماماً، لأن الأطفال غالباً يعودون لنفس النقطة.',
  'تفقد فوراً الأماكن الخطرة أو الجاذبة القريبة (المصاعد، السلالم الكهربائية، دورات المياه، محلات الألعاب، أو نوافير المياه).',
  'اتصل بـ 911 وشارك أحدث صورة للطفل (التقط صورة لطفلك بجوالك قبل دخول الأماكن المزدحمة لتوثيق ملابسه في ذلك اليوم).'],
 ['لا تشعر بالحرج من رفع صوتك بوصف الطفل في اللحظة الأولى.',
  'لا يغادر جميع أفراد الأسرة نقطة الاختفاء معاً؛ يجب بقاء شخص ثابت في نفس المكان.'],
 ['وضع سوار تعريفي أو بطاقة في جيب الطفل تحتوي على رقم جوال الأب والأم.']),

/* ---------- الفئة 3: طوارئ المنزل ---------- */
P('home_safety','تسرب الغاز المنزلي (LPG)','998','خطر انفجار واشتعال — إخلاء وتأمين فوري','w',
 'عند شم رائحة غاز: لا تلمس أي مفتاح كهرباء (لا تشغّل ولا تطفئ أي زر إضاءة أو مروحة شفط) لأن الشرارة الداخلية الصغيرة كفيلة بإحداث انفجار.',
 ['أغلق صمام أسطوانة الغاز الرئيسي ومفاتيح الموقد فوراً إذا كان الوصول إليها آمناً.',
  'افتح جميع النوافذ والأبواب الخارجية بهدوء لتهوية المنزل وتشتيت الغاز المتجمع بالقرب من الأرض.',
  'أخلِ جميع أفراد الأسرة إلى خارج المنزل فوراً (استخدم الدرج وتجنب المصعد تماماً).',
  'افصل الكهرباء من القاطع الرئيسي الخارجي فقط إذا كان لوح القواطع خارج المنزل وبعيداً عن منطقة التسرب.',
  'بعد الخروج لمكان آمن، اتصل بالدفاع المدني على الرقم 998 إذا استمر التسرب.'],
 ['لا تشغّل مروحة الشفط أو تطفئ الأنوار أو تسحب أي فيش كهربائي داخل المنطقة المشتبه بتسرب الغاز فيها.',
  'لا تختبر مكان تسرب الغاز باستخدام ولاعة أو عود ثقاب أبداً.'],
 ['تركيب كاشف تسرب الغاز الذكي في المطبخ بالقرب من مستوى الأرض (لأن غاز الطبخ أثقل من الهواء).']),

P('home_safety','حرائق المطبخ والزيوت والكهرباء (قاعدة PASS)','998','خطر امتداد النيران والدخان — تدخل أو إخلاء فوري','c',
 'لا تسكب الماء أبداً على مقلاة الزيت المشتعلة؛ فالماء يتبخر لحظياً وينثر كرات النار المشتعلة في أنحاء المطبخ.',
 ['في حريق مقلاة الزيت: أطفئ مصدر الغاز/الكهرباء فوراً، وغطِّ المقلاة ببطانية حريق أو غطاء معدني محكم لكتم الأكسجين، واتركها حتى تبرد تماماً.',
  'في حريق جهاز كهربائي: افصل التيار من القاطع الرئيسي أولاً، ثم استخدم طفاية البودرة الجافة (ABC) أو ثاني أكسيد الكربون (CO2).',
  'لاستخدام طفاية الحريق طبّق قاعدة (PASS): اسحب مسمار الأمان، وجّه الخرطوم لقاعدة اللهب، اضغط المكبس، وحرّك يميناً ويساراً.',
  'إذا كان الحريق كبيراً أو يتصاعد منه دخان كثيف: أغلق باب الغرفة المشتعلة خلفك لحصر النار وأخلِ المنزل فوراً.',
  'عند الخروج وسط الدخان: انخفض قريباً من الأرض وغطِّ أنفك وفمك بقماش مبلل، ثم اتصل بالدفاع المدني (998).'],
 ['لا تحمل مقلاة الزيت المشتعلة وتمشِ بها نحو الحوض أو الخارج لأن الزيت المشتعل سينسكب عليك.',
  'لا تستخدم المصعد الكهربائي أثناء الحريق تحت أي ظرف.'],
 ['توفير طفاية حريق بودرة (4 أو 6 كجم) وبطانية حريق في مدخل المطبخ بمكان ظاهر.']),

P('home_safety','الصعق الكهربائي','997','حرج — لا تلمس المصاب قبل فصل التيار','d',
 'لا تلمس المصاب المتصل بالتيار الكهربائي بيديك المجردتين أبداً حتى لا تصبح ضحية ثانية؛ افصل القاطع الكهربائي أولاً.',
 ['افصل مصدر التيار الكهربائي فوراً من القاطع الرئيسي (الطبلون) أو بنزع القابس إذا كان آمناً.',
  'إذا تعذر فصل التيار فوراً: قف على سطح جاف عازل (خشب أو مطاط) واستخدم عصا خشبية جافة أو كرسياً بلاستيكياً لإبعاد السلك عن المصاب.',
  'بمجرد ابتعاد المصاب عن التيار: افحص وعيه وتنفسه فوراً؛ فالصعق الكهربائي قد يسبب رجفاناً وتوقفاً مفاجئاً للقلب.',
  'إذا كان لا يتنفس: اتصل بـ 997 وابدأ الإنعاش القلبي الرئوي (CPR) فوراً.',
  'إذا كان واعياً ويتنفس: ابحث عن حروق الكهرباء (في نقطة الدخول والخروج) وغطِّها بشاش معقم جاف.'],
 ['لا تقترب من أسلاك الضغط العالي الساقطة على الأرض أو الملامسة للمركبات أو تجمعات المياه.',
  'لا تستخدم أي أداة معدنية أو مبللة لإبعاد المصاب عن مصدر الكهرباء.'],
 ['التأكد من عمل قاطع الحماية من التسرب الأرضي (RCD / ELCB) في لوحة كهرباء المنزل.']),

P('home_safety','الاحتجاز داخل المصعد','998','سلامة المباني — التزام الهدوء ومنع الخروج العشوائي','t',
 'المصعد المغلق يحتوي على فتحات تهوية كافية ولا ينفد منه الأكسجين؛ الخطر الأكبر هو محاولة فتح الباب عنوة والخروج بين الطوابق.',
 ['اضغط زر جرس الإنذار أو الهاتف الداخلي في المصعد، واتصل بالدفاع المدني (998) أو رقم صيانة المصعد المدون بالداخل.',
  'اضغط على أزرار جميع الطوابق السفلية؛ فقد يتحرك المصعد تلقائياً لأقرب طابق ببطارية الطوارئ (ARD).',
  'اجلس على أرضية المصعد أو اسند ظهرك للحائط للحفاظ على توازنك وتقليل التوتر ريثما يصل المختصون.',
  'إذا كنت خارج المصعد: طمئن المحتجزين بالداخل، وتوجه لغرفة المحرك لفصل قاطع المصعد الرئيسي فقط إذا طُلب منك ذلك من الدفاع المدني.',
  'اترك عملية الإنزال اليدوي وفتح الباب بالمفتاح المثلث لفني الصيانة المختص أو رجال الدفاع المدني.'],
 ['لا تحاول أبداً فتح باب المصعد عنوة والقفز للخارج إذا كان المصعد متوقفاً بين طابقين.',
  'لا تقفز داخل كابينة المصعد لمحاولة تحريكها لأن ذلك يفعل فرامل الأمان الميكانيكية.'],
 ['تثبيت ملصق واضح داخل المصعد وخارجه يحتوي على رقم الدفاع المدني (998) ورقم طوارئ الصيانة.']),

P('home_safety','خطة الإخلاء المنزلي العائلي السريع','911','تخطيط وقائي واستجابة سريعة للأسرة','p',
 'اخرج أولاً ثم اتصل بالطوارئ من الخارج؛ لا تضيع الثواني الثمينة في جمع الممتلكات أو المقتنيات الثمينة.',
 ['عند سماع جرس الإنذار أو اكتشاف خطر: نادِ بصوت عالٍ وواضح لتنبيه جميع أفراد الأسرة فوراً.',
  'تأكد من مرافقة الأطفال وكبار السن (حدد مسبقاً من هو المسؤول عن مساعدة كل طفل أو كبير سن في الأسرة).',
  'قبل فتح أي باب داخلي: المس مقبض الباب وأعلى الباب بظهر يدك؛ إذا كان ساخناً لا تفتحه واسلك المخرج البديل.',
  'أغلق الأبواب خلفك أثناء الخروج (دون قفلها بالمفتاح) لإبطاء انتشار الدخان والحريق بين الغرف.',
  'اتجه مباشرة إلى (نقطة التجمع العائلية) المحددة خارج المبنى، وتفقد وجود الجميع بالاسم، ثم اتصل بـ 998 أو 911.'],
 ['لا تعد إلى داخل المنزل المشتعل تحت أي ظرف.',
  'لا تقفل أبواب المخارج الرئيسية بالمفتاح وتترك المفتاح في مكان بعيد ليلاً.'],
 ['تحديد مخرجين لكل غرفة وإجراء تجربة إخلاء عائلية سريعة مرة كل 6 أشهر.']),

P('home_safety','اختناق الفحم والحطب (التسمم بأول أكسيد الكربون)','997','حرج جداً — القاتل الصامت بلا رائحة ولا لون','d',
 'غاز أول أكسيد الكربون ليس له رائحة ولا لون ولا طعم، ويسبب النعاس ثم الإغماء الجماعي أثناء النوم دون شعور بالاختناق.',
 ['عند الشعور بصداع مفاجئ، دوخة، غثيان، أو خمول لدى الجالسين حول الفحم/الحطب: افتح الأبواب والنوافذ فوراً وأخرج الجميع للهواء الطلق.',
  'أخرج المصابين الغائبين عن الوعي إلى الهواء النقي فوراً واتصل بالهلال الأحمر (997) والدفاع المدني (998).',
  'فكّ الملابس الضيقة حول الرقبة والصدر، وافحص التنفس؛ إذا كان المصاب لا يتنفس ابدأ الإنعاش القلبي الرئوي (CPR).',
  'أطفئ مصدر الفحم أو المدفأة أو المولد الكهربائي وأخرجه خارج المكان المغلق.',
  'يجب نقل جميع المتعرضين للمستشفى لتلقي الأكسجين النقي بتركيز 100% حتى لو تحسنت أعراضهم مبدئياً.'],
 ['لا تدخل المنقلة أو الفحم المشتعل إلى الغرفة أو الخيمة المغلقة حتى لو تحول بالكامل إلى جمر لا يدخن.',
  'لا تشغّل محرك السيارة أو المولد الكهربائي داخل كراج مغلق متصل بالمنزل.'],
 ['تركيب جهاز كاشف غاز أول أكسيد الكربون (CO Detector) في المجالس الشتوية والخيام.']),

P('home_safety','التسمم الغذائي والجفاف الحاد','937','إسعاف منزلي — تعويض السوائل والأملاح','p',
 'الخطر الأكبر في التسمم الغذائي هو الجفاف السريع وفقدان الأملاح؛ ابدأ بتعويض السوائل بمحلول الجفاف الفموي (ORS) برشفات صغيرة متكررة.',
 ['أوقف تناول الأطعمة الصلبة والألبان والدهون مؤقتاً لإراحة المعدة لبضع ساعات.',
  'أعطِ المصاب محلول الإماهة الفموية (ORS) أو الماء برشفات صغيرة جداً كل 5-10 دقائق.',
  'احتفظ بعينة من الطعام المشتبه به في كيس مغلق إذا ظهرت الأعراض على عدة أفراد في نفس الوقت.',
  'اتصل باستشارات صحة (937) لتقييم الأعراض ومعرفة الأدوية المسموحة.',
  'توجه للطوارئ فوراً إذا ظهر دم في القيء أو الإسهال، أو استمر القيء لأكثر من 24 ساعة، أو ظهرت زغللة بالعين.'],
 ['لا تعطِ أدوية إيقاف الإسهال بدون استشارة طبية لأنها قد تحبس البكتيريا والسموم داخل الأمعاء.',
  'لا تعطِ المشروبات الغازية أو العصائر المركزة بالسكر كبديل لمحلول الجفاف الطبي.'],
 ['علامات الجفاف الشديد: جفاف الفم واللسان، قلة التبول ولونه الداكن، ودوخة عند الوقوف.']),

/* ---------- الفئة 4: المركبة والطريق ---------- */
P('vehicle_road','تعطل المركبة المفاجئ على الخط السريع','996','سلامة مرورية — تأمين الركاب أولاً','t',
 'الوقوف داخل سيارة متعطلة على كتف طريق سريع خطر جداً؛ أخرج جميع الركاب من الأبواب اليمنى ليقفوا خلف الحاجز المعدني بعيداً عن الطريق.',
 ['شغّل إشارات التحذير الرباعية (الفلشر) فور الشعور بالعطل، وارفع قدمك عن الوقود تدريجياً للاتجاه لأقصى الكتف الأيمن.',
  'أوقف المركبة بأبعد مسافة ممكنة عن مسار الشاحنات والسيارات، ولفّ المقود قليلاً نحو اليمين مع تفعيل فرامل اليد.',
  'أخرج العائلة من الأبواب اليمنى فقط (الجهة البعيدة عن السيارات المسرعة) ليبقوا في مكان آمن خلف الحاجز.',
  'ارتدِ السترة العاكسة وضع مثلث التحذير العاكس خلف المركبة بمسافة 50 إلى 100 متر على الطرق السريعة.',
  'اتصل بأمن الطرق (996) أو الطوارئ الموحد (911) وأرسل إحداثيات موقعك.'],
 ['لا تقف خلف المركبة أو في المسار الأيسر لمحاولة إصلاح عطل أو تبديل إطار بجانب السيارات المسرعة.',
  'لا تفتح غطاء المحرك إذا كان هناك دخان كثيف أو بخار ماء يغلي.'],
 ['حقيبة طوارئ السيارة: مثلث عاكس، سترة فسفورية، منفاخ إطارات، شاحن بطارية متنقل (Jump Starter)، كشاف، ومياه شرب.']),

P('vehicle_road','نفاد بطارية المفتاح الذكي أو بطارية السيارة','996','إجراء تقني سريع — تشغيل المركبة في الطوارئ','t',
 'كل مفتاح ذكي يحتوي بداخله على مفتاح معدني مخفي لفتح الباب، وشريحة إلكترونية (RFID/NFC) تعمل بدون بطارية عند تقريبها من نقطة القراءة.',
 ['لفتح باب السيارة: اضغط زر التحرير الصغير في ظهر الريموت الذكي واسحب المفتاح المعدني الميكانيكي المخفي لفتح مقبض باب السائق.',
  'لتشغيل السيارة (الطريقة الأولى): اضغط دواسة الفرامل، وقرّب المفتاح الذكي ليلامس زر التشغيل (Start/Stop) مباشرة بشعار المفتاح لمدة ثانيتين ثم اضغط الزر.',
  'لتشغيل السيارة (الطريقة الثانية في سيارات مثل BYD وغيرها): ضع المفتاح الذكي في العلامة المخصصة له داخل الكونسول الوسطي أو حامل الأكواب، ثم اضغط الفرامل وزر التشغيل.',
  'في حال نفاد بطارية الـ 12 فولت: وصّل الكابل الأحمر بالقطب الموجب (+) أولاً، ثم الأسود بالقطب السالب (-) أو نقطة التأريض المعدنية، وشغّل المركبة.',
  'استبدل بطارية الريموت ببطارية قرصية جديدة (غالباً مقاس CR2032) في أقرب وقت.'],
 ['لا تعكس أقطاب كابل الاشتراك (الموجب مع السالب) أبداً لتجنب تلف الكمبيوتر والفيوزات الرئيسية.'],
 ['الاحتفاظ ببطارية احتياطية مقاس (CR2032) في درج السيارة دائماً.']),

P('vehicle_road','انفجار الإطار أثناء القيادة على سرعة عالية','996','حرج — تحكم فوري لمنع انقلاب المركبة','d',
 'إياك والضغط على دواسة الفرامل عند انفجار الإطار؛ الضغط على الفرامل يخل بتوازن السيارة فوراً ويؤدي لانحرافها الحاد أو انقلابها.',
 ['أمسك عجلة القيادة (الدركسون) بكلتا يديك بقوة وثبات شديدين في مسار مستقيم للأمام.',
  'ارفع قدمك عن دواسة الفرامل تماماً؛ وفي الثانية الأولى يمكنك إبقاء لمسة خفيفة جداً على دواسة الوقود للحفاظ على توازن الدفع الأمامي ثم ارفع قدمك تدريجياً.',
  'اترك السيارة تتباطأ من تلقاء نفسها بفعل مقاومة الهواء والإطار التالف دون أي التواء حاد بالمقود.',
  'شغّل إشارات التحذير الرباعية (الفلشر)، وعندما تنخفض السرعة لأقل من 40 كم/ساعة، وجّه السيارة بهدوء تام نحو الكتف الأيمن.',
  'استخدم الفرامل بلطف شديد فقط في الأمتار الأخيرة قبل التوقف الكامل.'],
 ['لا تضغط الفرامل بقوة مفاجئة.',
  'لا تلفّ المقود بعنف في الاتجاه المعاكس لسحبة الإطار.'],
 ['مراقبة نظام ضغط وحرارة الإطارات (TPMS) وعدم القيادة بإطار منخفض الضغط.']),

P('vehicle_road','الحوادث المرورية وتأمين الموقع (قاعدة PAS)','911','استجابة ميدانية منظمة — احمِ، أبلغ، أسعف','c',
 'تأمين موقع الحادث أولاً يمنع وقوع تصادمات متتالية؛ لا تخرج مصاباً من السيارة إلا إذا كانت السيارة تحترق أو كان المصاب فاقداً للوعي ولا يتنفس.',
 ['(احمِ - Protect): أوقف سيارتك في مكان آمن بعيداً عن المسار، شغّل الفلشر، ارتدِ السترة العاكسة، وضع مثلث التحذير قبل موقع الحادث بـ 100 متر.',
  'أطفئ محركات السيارات المتصادمة واسحب فرامل اليد لمنع تحركها أو اشتعال الوقود.',
  '(أبلغ - Alert): اتصل فوراً بالطوارئ الموحد (911) أو الهلال الأحمر (997) وحدد الموقع الدقيق، عدد المركبات، وعدد المصابين وحالتهم.',
  '(أسعف - Support): تحدث مع المصابين لطمأنتهم، وأوقف أي نزيف خارجي حاد بالضغط المباشر أو التورنيكيه دون تحريك رقبتهم أو ظهرهم.',
  'في الحوادث البسيطة بدون إصابات: أخرج المركبات من مسار الطريق لتجنب عرقلة السير وتواصل مع (نجم) أو عبر تطبيق توكلنا/أبشر.'],
 ['لا تتجمهر أو تقف في منتصف الطريق لتصوير الحادث أو إعاقة وصول سيارات الإسعاف.',
  'لا تسحب مصاباً عالقاً داخل السيارة بالقوة لخطورة إصابته بشلل دائم في العمود الفقري.'],
 ['وجود طفاية حريق صالحة ومقص حزام أمان وكاسر زجاج طوارئ في متناول يد السائق.']),

P('vehicle_road','اشتعال أو حريق المركبة','998','حرج جداً — إخلاء فوري وعدم فتح الكبوت','c',
 'لا تفتح غطاء المحرك (الكبوت) بالكامل إذا رأيت دخاناً أو لهباً يخرج منه؛ لأن فتحه يدخل الأكسجين دفعة واحدة ويفجر اللهب في وجهك.',
 ['قف فوراً في أقصى الكتف الأيمن، أطفئ المحرك تماماً (لإيقاف ضخ الوقود)، وشغّل الفلشر.',
  'أخرج جميع الركاب فوراً وابتعدوا عن المركبة بمسافة لا تقل عن 30 إلى 50 متراً عكس اتجاه الريح.',
  'اتصل بالدفاع المدني (998) أو (911).',
  'إذا كان الحريق في بدايته البسيطة جداً وتوفرت طفاية حريق: وجّه فوهة الطفاية من خلال الشبك الأمامي أو من فتحة صغيرة جداً للكبوت دون رفعه.',
  'في السيارات الهجينة أو الكهربائية (PHEV/EV): إذا صدر الدخان أو الصوت من أسفل المركبة (البطارية عالية الجهد)، ابتعد فوراً ولا تحاول إطفاءها يدوياً وأبلغ الدفاع المدني بأنها مركبة هجينة/كهربائية.'],
 ['لا ترفع غطاء المحرك باليد عند وجود حريق.',
  'لا تعد للسيارة المشتعلة لأخذ الجوال أو الأوراق الشخصية.'],
 ['تثبيت طفاية حريق بودرة جافة (1-2 كجم) تحت مقعد السائق أو الراكب الأمامي.']),

/* ---------- الفئة 5: الطقس والبر ---------- */
P('weather_outdoor','ضربة الشمس والإجهاد الحراري الشديد','997','حرج — خفض حرارة الجسم فوراً','w',
 'ضربة الشمس طارئ طبي حرج (حرارة الجسم فوق 40 مع جفاف الجلد أو تشوش الوعي)؛ التبريد الخارجي الفوري بالماء البارد والتهوية يسبق أي إجراء آخر.',
 ['انقل المصاب فوراً إلى مكان مظلل ومكيف أو جيد التهوية، واطلب الاتصال بـ 997.',
  'خفف ملابسه الخارجية، وارفَع ساقيه قليلاً أثناء الاستلقاء.',
  'برّد جسم المصاب بسرعة: رشّ جسمه بالماء الفاتر/البارد مع توجيه مروحة نحوه، وضع كمادات باردة تحت الإبطين، وحول الرقبة، وأعلى الفخذين.',
  'إذا كان المصاب واعياً تماماً (في حالة الإجهاد الحراري وليس فاقداً للوعي): أعطه رشفات متدرجة من الماء البارد أو محلول الجفاف (ORS).',
  'راقب مستوى الوعي والتنفس باستمرار حتى وصول فرقة الإسعاف.'],
 ['لا تعطِ السوائل عن طريق الفم لمصاب يعاني من تشوش ذهني أو دوخة شديدة أو غياب عن الوعي.',
  'لا تعتمد على خافضات الحرارة الدوائية (مثل الباراسيتامول) لعلاج ضربة الشمس لأنها غير فعالة في هذه الحالة.'],
 ['علامات ضربة الشمس الحرجة: توقف التعرق، احمرار وسخونة الجلد، هذيان أو تلعثم، تسارع شديد بالنبض.']),

P('weather_outdoor','لدغات العقارب والثعابين في البر','937','طوارئ سموم برية — تثبيت الطرف وعدم جرح المكان','d',
 'لا تقم أبداً بجرح مكان اللدغة بالسكين أو مص السم بالفم أو ربط الطرف بحبل مشدود يقطع الدم؛ فهذه الأخطاء تزيد تلف الأنسجة وتسرع المضاعفات.',
 ['أبعد المصاب عن مكان العقرب أو الثعبان، وأجلسه في وضع راحة تامة وهدّئ من روعه (لأن التوتر والحركة يسرعان ضخ الدم وانتشار السم).',
  'ثبّت الطرف الملدوغ بجبيرة واجعله في مستوى القلب أو أخفض قليلاً بدون تحريكه.',
  'انزع الخواتم والساعات والأحذية الضيقة من الطرف المصاب قبل أن يبدأ بالتورم.',
  'نظف مكان اللدغة بالماء والصابون بلطف، وفي لدغة العقرب يمكنك وضع كمادة باردة لتخفيف الألم الموضعي.',
  'اتصل فوراً بـ 997 أو خط السموم (937) وتوجه لأقرب مستشفى لتلقي المصل المضاد.'],
 ['لا تقطع أو تشق الجلد بموس أو سكين ولا تمص السم بفمك أبداً.',
  'لا تربط تورنيكيه (عاصبة قاطعة للدم) في لدغات الثعابين والعقارب لأن حصر السم يسبب غرغرينا وبتر للطرف.'],
 ['نفض الأحذية والفرش قبل ارتدائها أو النوم عليها في المخيمات.']),

P('weather_outdoor','السيول والأمطار الغزيرة واحتجاز المركبة بالماء','998','تحذير دفاع مدني — لا تجازف بعبور الأودية','t',
 'لا تعبر أي وادٍ أو تجمع مياه جارية بسيارتك مهما بدت المياه ضحلة؛ فارتفاع 30 سم من المياه الجارية كفيل بجرف سيارة صغيرة، و60 سم يجرف سيارات الدفع الرباعي.',
 ['ابتعد فوراً عن بطون الأودية، مجاري السيول، والمناطق المنخفضة وأعمدة الإنارة الكهربائية.',
  'إذا حاصرت المياه سيارتك وتوقفت: فكّ حزام الأمان فوراً لك ولجميع الركاب (بدءاً بالأطفال الأكبر فالأصغر).',
  'افتح نوافذ السيارة الكهربائية فوراً قبل أن يصل الماء لمستوى الدوائر الكهربائية ويعطلها.',
  'إذا تعذر فتح الباب بسبب ضغط الماء ولا تفتح النافذة: اكسر إحدى النوافذ الجانبية (وليس الزجاج الأمامي) من زاويتها السفلية باستخدام كاسر الزجاج أو قضيب مسند الرأس المعدني.',
  'اخرج من النافذة واصعد لسطح المركبة واتصل بالدفاع المدني (998) أو (911).'],
 ['لا تحاول عبور السيول بالمركبة أو المشي في مياه جارية.',
  'لا تحاول كسر الزجاج الأمامي للمركبة لأنه مزدوج ومصفح؛ اكسر الزجاج الجانبي فقط.'],
 ['الاحتفاظ بأداة كسر الزجاج وقطع حزام الأمان معلقة في الكونسول الوسطي.']),

P('weather_outdoor','موجات الغبار ونوبات الربو الحادة','937','وقاية وإسعاف تنفسي — حماية مرضى الربو','w',
 'في نوبة الربو الحادة: أجلس المريض في وضع مستقيم مائل قليلاً للأمام (لا تجعله يستلقي على ظهره أبداً) وأعطه البخاخ الإسعافي فوراً.',
 ['عند بدء نوبة ضيق التنفس أو الربو: أجلس المصاب بهدوء وفكّ أي ملابس ضيقة حول الرقبة والصدر.',
  'استخدم البخاخ الموسع للشعب الهوائية (الإسعافي مثل السالبوتامول) بمعدل 4 بخات (بخة واحدة ثم 4 أنفاس عميقة، وتكرر 4 مرات).',
  'انتظر 4 دقائق؛ إذا لم يتحسن التنفس، كرر إعطاء 4 بخات أخرى.',
  'إذا استمر ضيق التنفس أو ازرقّت الشفاه أو عجز المريض عن إكمال جملة واحدة: اتصل فوراً بـ 997 مع الاستمرار بإعطاء 4 بخات كل 4 دقائق حتى وصول الإسعاف.',
  'أثناء الغبار: أغلق النوافذ بإحكام، وشغّل التكييف على وضع تدوير الهواء الداخلي مع منقي الهواء.'],
 ['لا تجعل مصاب نوبة الربو يستلقي على ظهره لأن ذلك يزيد صعوبة التنفس.'],
 ['تفعيل تدوير الهواء الداخلي (Recirculation) في تكييف السيارة عند الدخول في موجة غبار.']),

P('weather_outdoor','التغريز والانقطاع في الصحراء والبر','911','بقاء وإنقاذ بري — ابقَ بجوار المركبة','w',
 'القاعدة الأولى للنجاة في الصحراء: لا تغادر مركبتك أبداً للسير على الأقدام بحثاً عن الإرسال؛ فالمركبة يسهل رصدها من الطائرات وتوفر الظل والحماية.',
 ['ابقَ بجانب المركبة، واستظل بداخلها أو تحتها نهاراً لتقليل فقدان السوائل بالتعرق.',
  'لتخليص السيارة المغرزة: خفف ضغط الإطارات إلى (12-15 PSI)، وأزل الرمل من أمام الإطارات ومن تحت بطن المركبة، وتحرك للأمام والخلف بهدوء دون حفر.',
  'إذا تعذر الخروج: اتصل بطوارئ (911) وأرسل إحداثيات موقعك.',
  'رشّد استهلاك المياه (اشرب رشفات صغيرة منتظمة ولا تأكل الطعام الجاف إذا كان الماء قليلاً).',
  'ارفع غطاء المحرك وضع قطعة قماش زاهية أو استخدم مرآة المركبة لعكس ضوء الشمس نهاراً والكشاف عند سماع طائرة البحث.'],
 ['لا تمشِ في الصحراء نهاراً تحت الشمس الحارقة تحت أي ظرف.',
  'لا تستهلك بطارية الجوال في التصفح؛ فعّل وضع توفير الطاقة الأقصى.'],

<script>/* ثواني — تطبيق PWA تفاعلي (يعتمد على data.js: CATS, LV, PRESETS) */

const norm = s => String(s||'').toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();

  bolt:'<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  wave:'<path d="M2 8c2.500 0 2.500-2 5-2s2.500 2 5 2 2.500-2 5-2 2.500 2 5 2v3c-2.500 0-2.500-2-5-2s-2.500 2-5 2-2.500-2-5-2-2.500 2-5 2zM2 15c2.500 0 2.500-2 5-2s2.500 2 5 2 2.500-2 5-2 2.500 2 5 2v3c-2.500 0-2.500-2-5-2s-2.500 2-5 2-2.500-2-5-2-2.500 2-5 2z"/>',
  sun:'<circle cx="12" cy="12" r="4.500"/><path d="M11 1h2v4h-2zM11 19h2v4h-2zM1 11h4v2H1zM19 11h4v2h-4zM4.200 5.600l1.400-1.400 2.800 2.800-1.400 1.400zM15.600 17l1.400-1.400 2.800 2.800-1.400 1.400zM17 8.400l2.800-2.800 1.400 1.400-2.800 2.800zM3.800 18.400l2.800-2.800 1.400 1.400-2.800 2.800z"/>',
  gas:'<path d="M9 2h6v2h-1v2.500c2.500.8 4 3 4 5.500v8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-8c0-2.500 1.500-4.700 4-5.500V4H9z"/>',
  car:'<path d="M5 11l1.600-4.500A2 2 0 0 1 8.500 5h7a2 2 0 0 1 1.900 1.500L19 11a2 2 0 0 1 2 2v4h-2v1.500a1.500 1.500 0 0 1-3 0V17H8v1.500a1.500 1.500 0 0 1-3 0V17H3v-4a2 2 0 0 1 2-2zm3-4-1.200 4h10.400L16 7z" fill-rule="evenodd"/>',
  child:'<circle cx="12" cy="6" r="3.500"/><path d="M5 21c0-4.500 3-8 7-8s7 3.500 7 8z"/>',
  warn:'<path d="M12 2 1 21h22zm-1 7h2v6h-2zm0 8h2v2h-2z" fill-rule="evenodd"/>',

  bone:'<path d="M17 3.500a3 3 0 0 1 3 3c0 .8-.3 1.500-.9 2.100l-9.200 9.200c-.6.600-1.300.9-2.100.9a3 3 0 0 1-3-3c0-.8.3-1.500.9-2.100l9.200-9.200c.6-.6 1.300-.9 2.100-.9z"/>',
  cross:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
  wind:'<path d="M3 8h11a3 3 0 1 0-3-3h2a1 1 0 1 1 1 1H3zM3 13h15a3 3 0 1 1-3 3h2a1 1 0 1 0 1-1H3zM3 18h8v2H3z"/>',
  pill:'<path d="M8 3a5 5 0 0 0-3.500 8.500l8 8A5 5 0 0 0 19.500 12.500l-8-8A5 5 0 0 0 8 3zm0 2a3 3 0 0 1 2.100.9l2.100 2.100-5.200 5.200L4.900 11A3 3 0 0 1 8 5z" fill-rule="evenodd"/>',
  home:'<path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/>',
  lift:'<path d="M5 3h14a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm3 7 4-4 4 4zm0 4h8l-4 4z" fill-rule="evenodd"/>',
  siren:'<path d="M12 3a6 6 0 0 1 6 6v6H6V9a6 6 0 0 1 6-6zM4 17h16v3H4zM11 0h2v2h-2z"/>'
};
function kindOf(p){
  const t=p.title;
  if(/غاز/.test(t))return'gas';
  if(/صعق|كهرب/.test(t))return'bolt';
  if(/مصعد/.test(t))return'lift';
  if(/حريق|اشتعال|حروق|حرائق/.test(t))return'flame';
  if(/غرق|سيول|مياه/.test(t))return'wave';
  if(/شمس|حرار/.test(t))return'sun';
  if(/لدغ/.test(t))return'warn';
  if(/عين/.test(t))return'eye';
  if(/كسور|عظام|عمود/.test(t))return'bone';
  if(/سكر|دواء|أدوية/.test(t)&&!/نوبة قلبية/.test(t))return'pill';
  if(/ربو|غبار|غصة|اختناق|الفحم/.test(t))return'wind';
  if(/نزيف|جروح|بتر|رعاف/.test(t))return'drop';
  if(/إنعاش|قلب|جلطة|إغماء|حساسية/.test(t))return'heart';
  if(/طفل|رضيع|أطفال|كبار|سقوط/.test(t))return'child';
  if(/مركبة|إطار|حوادث|المفتاح|بطارية|الخط السريع|المرور|التغريز|الصحراء/.test(t))return'car';
  if(/إخلاء|منزل|التسمم الغذائي/.test(t))return'home';
  return'cross';
}
const pic = p => `<span class="pic lv-${p.lv||'c'}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${G[kindOf(p)]}</svg></span>`;
const catIcon = g => `<svg class="ic" viewBox="0 0 24 24" fill="#fff" opacity=".95" aria-hidden="true">${G[g]}</svg>`;

const CATUI = {
  first_aid:{g:'g-red',ic:'heart',t:'حالات حرجة',d:'مثل نزيف، غصة، توقف قلب'},
  kids_elderly:{g:'g-orange',ic:'child',t:'الأطفال وكبار السن',d:'غصة رضيع، تسمم، سقوط'},
  home_safety:{g:'g-green',ic:'home',t:'سلامة المنزل',d:'غاز، حريق، كهرباء، مصعد'},
  vehicle_road:{g:'g-blue',ic:'car',t:'المركبة والطريق',d:'تعطل، إطار، حوادث، حريق'},

};
const QUICK = ['p3','p1','p2','p5','p20','p21','p25','p15'];
const QLABEL = {p3:'توقف القلب',p1:'اختناق بغصة',p2:'نزيف شديد',p5:'ألم صدر أو جلطة',p20:'رائحة غاز',p21:'حريق مطبخ',p25:'دخان فحم',p15:'طفل ابتلع سماً'};

/* ================= toast / speech / helpers ================= */
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3200);}
const FDEF={loc:'منزل العائلة',tel:'911 / 997',pt:'خارج المبنى الرئيسي',kit:'مدخل المنزل / المطبخ'};
function family(){const o={};for(const k in FDEF)o[k]=(LS.get('fam_'+k,'')||'').trim()||FDEF[k];return o;}

let speaking=false;
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false;document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));const b=document.querySelector('[data-act=speak]');if(b)b.innerHTML=U.spk+' تشغيل الصوت';}
function speak(text){
  if(!('speechSynthesis' in window)){toast('جهازك لا يدعم القراءة الصوتية',true);return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.95;
    const v=(speechSynthesis.getVoices()||[]).find(v=>/^ar/i.test(v.lang));
    if(v)u.voice=v;else if(speechSynthesis.getVoices().length)toast('لم يُعثر على صوت عربي على جهازك',true);
    u.onstart=()=>{speaking=true;document.querySelectorAll('.wave').forEach(w=>w.classList.add('on'));const b=document.querySelector('[data-act=speak]');if(b)b.innerHTML=U.stop+' إيقاف الصوت';};
    u.onend=u.onerror=()=>{speaking=false;document.querySelectorAll('.wave').forEach(w=>w.classList.remove('on'));const b=document.querySelector('[data-act=speak]');if(b)b.innerHTML=U.spk+' تشغيل الصوت';};
    speechSynthesis.speak(u);
  }catch(e){toast('تعذر تشغيل الصوت',true);}
}

/* ================= state ================= */
const S={q:'',cat:'all',focus:false,scrollTo:null,swReady:false,deferred:null};
const GD={id:null,idx:0,mode:'steps',talk:false};
const hasVoiceIn = !!(window.SpeechRecognition||window.webkitSpeechRecognition);
const recent=()=>{try{return JSON.parse(LS.get('recent','[]'))}catch(e){return[]}};
function pushRecent(id){const r=recent().filter(x=>x!==id);r.unshift(id);LS.set('recent',JSON.stringify(r.slice(0,4)));}

/* ================= views ================= */
const NAV=[['home','الرئيسية',U.home],['lib','البطاقات',U.grid],['cpr','إنعاش',U.pulse],['me','خطتي',U.user],['refs','المراجع',U.book]];
function renderNav(cur){
  $('nav').innerHTML=NAV.map(([k,l,i])=>`<button data-go="#/${k}" class="${k==='cpr'?'mid':''}" ${k===cur?'aria-current="page"':''} aria-label="${l}">${i}${k==='cpr'?'':'<span>'+l+'</span>'}</button>`).join('');
}
const netPill = () => `<span class="pill" data-net></span>`;
function updateNet(){
  document.querySelectorAll('[data-net]').forEach(el=>{
    const off=!navigator.onLine;el.className='pill'+(off?' off':'');
    el.innerHTML='<i></i>'+(off?'تعمل بدون إنترنت':(S.swReady?'متاح بلا إنترنت':'متصل'));

}
const searchBox = ph => `<div class="search"><span class="mag">${U.search}</span><label class="sr" for="q">بحث</label><input id="q" type="search" autocomplete="off" placeholder="${ph}" value="${esc(S.q)}">${hasVoiceIn?`<button class="mic" data-act="voice" aria-label="بحث صوتي">${U.mic}</button>`:''}</div>`;

function viewHome(){
  $('hdr').className='hdr';
  $('hdr').innerHTML=`<div class="hrow"><h1>ثواني</h1>${netPill()}</div>${searchBox('ابحث عن حالة أو إصابة…')}`;
  const rc=recent().map(byId).filter(Boolean);
  const cats=Object.keys(CATUI).map(k=>{const n=LIB.filter(p=>p.cat===k).length,c=CATUI[k];
    return `<button class="cat ${c.g}" data-go="#/lib/${k}">${catIcon(c.ic)}<div class="t"><h3>${c.t}</h3><p>${c.d}</p><span class="badge num">${n} بطاقة</span></div></button>`}).join('');
  $('main').innerHTML=`
  <div class="sos-wrap"><button class="sos" data-act="sos" aria-label="اتصال بالطوارئ"><small>اتصال</small>بالطوارئ<b>997</b></button></div>
  <h2 class="sec">ماذا يحدث الآن؟</h2>
  <div class="quick">${QUICK.map(id=>{const p=byId(id);return p?`<button class="qk lv-${p.lv}" data-go="#/card/${id}">${pic(p)}<span>${esc(QLABEL[id]||p.title)}</span></button>`:''}).join('')}</div>
  ${rc.length?`<h2 class="sec">شاهدتها مؤخراً</h2><div class="rows">${rc.map(rowHTML).join('')}</div>`:''}
  <h2 class="sec">الوصول السريع</h2><div class="cats">${cats}</div>
  <h2 class="sec">لماذا هذا مهم؟</h2>
  <p class="fact">عند توقف القلب تنخفض فرص النجاة بنحو 7 إلى 10% مع كل دقيقة تمر دون إنعاش أو صدمة كهربائية. <a href="#/refs" data-ref="r1">[1]</a></p>
  <p class="fact">النزيف الشديد قد يُنهي الحياة خلال دقائق، وإيقافه يبدأ بيد أول شخص موجود. <a href="#/refs" data-ref="r4">[4]</a></p>
  <p class="fact">أول أكسيد الكربون بلا لون ولا رائحة، ويصيب الجالسين حول الفحم قبل أن يشعروا به. <a href="#/refs" data-ref="r7">[7]</a></p>
  <p class="sub" style="margin-top:8px">البطاقات للتوعية ولا تغني عن الاتصال بالإسعاف أو دورة إسعافات معتمدة.</p>`;
  const q=$('q');q.addEventListener('focus',()=>{S.focus=true;location.hash='#/lib';});
}
function rowHTML(p){return `<button class="row lv-${p.lv}" data-go="#/card/${p.id}">${pic(p)}<span class="tx">${esc(p.title)}<small>${esc(p.level)}</small></span><span class="ph num">${esc(p.phone)}</span></button>`;}

function filtered(){const q=norm(S.q);return LIB.filter(p=>(S.cat==='all'||p.cat===S.cat)&&(!q||norm([p.title,p.level,p.golden,(p.steps||[]).join(' '),(p.avoid||[]).join(' '),(p.gear||[]).join(' ')].join(' ')).includes(q)));}
function listHTML(){
  const l=filtered();
  return l.length?`<div class="rows">${l.map(rowHTML).join('')}</div>`:`<div class="empty">لا توجد بطاقة مطابقة لـ «${esc(S.q)}». جرّب كلمة أخرى، أو ولّد بطاقة من صفحة «خطتي».</div>`;
}
function viewLib(cat){
  if(cat!==undefined)S.cat=cat||'all';
  $('hdr').className='hdr';
  $('hdr').innerHTML=`<div class="hrow"><button class="ib" data-go="#/home" aria-label="رجوع">${U.back}</button><h2>${S.cat==='all'?'كل البطاقات':CATUI[S.cat]?CATUI[S.cat].t:''}</h2>${netPill()}</div>${searchBox('ابحث: غصة، لدغة، حريق…')}`;
  const chips=[['all','الكل ('+LIB.length+')']].concat(Object.keys(CATUI).map(k=>[k,CATUI[k].t+' ('+LIB.filter(p=>p.cat===k).length+')']));
  $('main').innerHTML=`<div class="chips" id="chips">${chips.map(([k,l])=>`<button class="chip" data-chip="${k}" aria-pressed="${S.cat===k}">${l}</button>`).join('')}</div><p class="sub" id="cnt" style="margin:4px 2px 10px"></p><div id="lst"></div>`;
  const fill=()=>{$('lst').innerHTML=listHTML();$('cnt').textContent=filtered().length+' بطاقة';document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.chip===S.cat));};
  fill();
  $('q').addEventListener('input',e=>{S.q=e.target.value;fill();});
  $('chips').addEventListener('click',e=>{const c=e.target.closest('[data-chip]');if(c){S.cat=c.dataset.chip;fill();}});
  if(S.focus){S.focus=false;$('q').focus();}
}

/* ---- guide ---- */
function guideText(p,i){return i===0?'القاعدة الأولى. '+p.golden:'الخطوة '+i+'. '+p.steps[i-1];}
function viewCard(id){
  const p=byId(id);if(!p){location.hash='#/lib';return;}
  if(GD.id!==id){GD.id=id;GD.idx=0;GD.mode='steps';GD.talk=false;stopSpeak();pushRecent(id);}
  $('hdr').className='hdr slim';
  $('hdr').innerHTML=`<div class="hrow"><button class="ib" data-act="back" aria-label="رجوع">${U.back}</button><h2>${esc(p.title.replace(/\s*\(.*\)\s*$/,''))}</h2><button class="ib" data-act="sos" aria-label="اتصال طوارئ" style="background:var(--red)"><b class="num" style="font-size:15px">${esc(p.phone)}</b></button></div>`;
  drawGuide();
}
function drawGuide(){
  const p=byId(GD.id),n=p.steps.length,i=GD.idx,main=$('main');
  const modes=`<div class="modes" role="tablist"><button role="tab" data-act="mode" data-m="steps" aria-selected="${GD.mode==='steps'}">خطوة بخطوة</button><button role="tab" data-act="mode" data-m="full" aria-selected="${GD.mode==='full'}">البطاقة كاملة</button></div>`;
  let body='';
  if(GD.mode==='full'){body=fullCard(p);}
  else if(i<=n){
    const bars=Array.from({length:n+1},(_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('');
    const extra=(p.id==='p3'?`<a class="btn ghost sm" href="#/cpr" data-go="#/cpr">${U.pulse} افتح إيقاع الإنعاش</a>`:'')+(p.id==='p2'?`<a class="btn ghost sm" href="#/cpr" data-go="#/cpr">ابدأ مؤقت العاصبة</a>`:'');
    body=`<div class="stage lv-${p.lv}" id="stage">
      <div class="art">${pic(p)}<div class="wave">${'<i></i>'.repeat(26)}</div><div class="cap">${esc(p.level)}</div></div>
      <div class="stepno">${i===0?'قبل أن تبدأ':'الخطوة '+i+' من '+n}</div>
      <div class="steptx ${i===0?'gold':''}" id="stx">${esc(i===0?p.golden:p.steps[i-1])}</div>
      <div class="bar" aria-hidden="true">${bars}</div>
      <div class="ctl"><button class="btn ghost" data-act="prev" aria-label="السابق" ${i===0?'disabled':''}>${U.prev}</button><button class="btn blue" data-act="speak">${speaking?U.stop+' إيقاف الصوت':U.spk+' تشغيل الصوت'}</button><button class="btn green" data-act="next">${i===n?'إنهاء':'التالي'} ${U.next}</button></div>
      ${extra?`<div class="act">${extra}</div>`:''}
    </div>
    <a class="btn red" href="tel:${esc(p.phone)}" style="margin-top:12px;width:100%">اتصل الآن ${esc(p.phone)}</a>`;
  } else {
    body=`<div class="stage lv-${p.lv} done"><div class="art">${pic(p)}</div>
      <h3>أحسنت. هل اتصلت بـ ${esc(p.phone)}؟</h3><p class="sub">تابع حالة المصاب حتى وصول المسعفين.</p>
      <div class="avoid"><h3>تجنب فوراً</h3><ul>${p.avoid.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>
      <div class="act"><a class="btn red" href="tel:${esc(p.phone)}">اتصل بـ ${esc(p.phone)}</a><button class="btn ghost" data-act="restart">إعادة الخطوات</button><button class="btn ghost" data-act="mode" data-m="full">عرض البطاقة كاملة</button></div></div>`;
  }
  main.innerHTML=modes+body;
  main.scrollTop=0;
  const st=$('stage');if(st){let x0=null;st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});

/* ---- CPR + timer ---- */
const C={run:false,count:0,t0:0,acc:0,beat:null,clk:null,actx:null};
const T={run:false,acc:0,t0:0,int:null,since:''};
function cprElapsed(){return Math.floor((C.acc+(C.run?Date.now()-C.t0:0))/1000);}
function cprTick(){
  if(C.run){
    C.count++;beep();try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
    const h=$('heart');if(h){h.classList.add('beat');setTimeout(()=>h.classList.remove('beat'),100);}
    if(C.count%30===0)cprAlert('30 ضغطة. إن كنت مدرباً أعطِ نفسين إنقاذيين، وإلا واصل الضغط دون توقف.');
  }
  cprPaint();
}
function cprAlert(t){const a=$('cAlert');if(a){a.textContent=t;a.hidden=false;}toast(t.split('.')[0]);}
function cprPaint(){
  const e=cprElapsed(),m=Math.floor(e/60),s=e%60;
  if($('cCount'))$('cCount').textContent=C.count;
  if($('cTime'))$('cTime').textContent=pad(m)+':'+pad(s);
  if(C.run&&e>0&&e%120===0&&C.lastSwap!==e){C.lastSwap=e;cprAlert('مضت دقيقتان. بدّل المسعف إن وُجد من يساعدك.');}
}
function beep(){try{
  if(!C.actx)C.actx=new (window.AudioContext||window.webkitAudioContext)();
  const o=C.actx.createOscillator(),g=C.actx.createGain();o.type='square';o.frequency.value=880;
  g.gain.setValueAtTime(.35,C.actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,C.actx.currentTime+.09);
  o.connect(g);g.connect(C.actx.destination);o.start();o.stop(C.actx.currentTime+.1);}catch(e){}}
function cprToggle(){
  if(C.run){C.acc+=Date.now()-C.t0;C.run=false;clearInterval(C.beat);clearInterval(C.clk);}
  else{if(C.actx&&C.actx.state==='suspended')C.actx.resume();C.run=true;C.t0=Date.now();cprTick();C.beat=setInterval(cprTick,60000/110);C.clk=setInterval(cprPaint,500);}
  cprDraw();markMid();
}
function cprReset(){C.run=false;clearInterval(C.beat);clearInterval(C.clk);C.count=0;C.acc=0;C.lastSwap=0;cprDraw();markMid();}
function cprDraw(){
  const b=$('press');if(!b)return;
  b.classList.toggle('on',C.run);b.textContent=C.run?'إيقاف مؤقت':(C.count?'استئناف':'اضغط الآن');
  const h=$('heart');if(h)h.classList.toggle('run',C.run);cprPaint();
}
function markMid(){const m=document.querySelector('.nav .mid');if(m)m.style.animation=C.run?'pulse 1s infinite':'';}
function tShow(){const s=Math.floor((T.acc+(T.run?Date.now()-T.t0:0))/1000);const el=$('tClock');if(el)el.textContent=pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
function viewCpr(){

  $('hdr').innerHTML=`<div class="hrow"><button class="ib" data-go="#/home" aria-label="رجوع">${U.back}</button><h2>إنعاش قلبي رئوي <small style="font-weight:500;opacity:.7">CPR</small></h2>${netPill()}</div>`;

  <div class="stats"><div class="stat"><b id="cCount" class="num">${C.count}</b><span>ضغطة</span></div><div class="stat"><b class="num">110</b><span>نبضة/دقيقة</span></div><div class="stat"><b id="cTime" class="num">00:00</b><span>الزمن</span></div></div>
