<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>وجهة رحلاتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout concept: غلاف جواز أخضر بذهبيات، وعليه أوراق: تذكرة الصعود للرحلة القادمة، وأوراق الإحصاءات، وصفحات الأختام.
   Type: Noto Kufi Arabic للعناوين (خط يشبه لوحات المطارات)، IBM Plex Sans Arabic للنص، Barlow Condensed لرموز المطارات (لوحة المغادرة).
   Look: اتجاه واحد ملتزم؛ لا وضع فاتح/داكن منفصل. */
:root{
  --board:#0b2a24; --cover:#123f35; --cover-2:#0e342b; --cover-3:#1a5646; --gold:#d3b15f; --gold-hi:#f2e0a0;
  --paper:#eceee0; --paper-2:#e1e5d2; --ink:#1c2c27; --muted:#5b6c62; --line:#c6cdb8;
  --ok:#17663f; --ok-bg:#d3ebdb; --warn:#8a5200; --warn-bg:#f5e1b0; --bad:#a1281f; --bad-bg:#f4d2cd; --info:#27408b; --info-bg:#d9e0f3;
  --f-d:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif; --f-b:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-c:"Barlow Condensed","IBM Plex Sans Arabic",Arial Narrow,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--board);color:#e6efe8;font-family:var(--f-b);font-size:15px;line-height:1.7;direction:rtl;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cover);z-index:40}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:radial-gradient(120% 40% at 50% 0%,var(--cover-3),var(--cover) 55%,var(--cover-2));position:relative;padding-block:18px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 0 80px rgba(0,0,0,.5)}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.35;font-weight:700}
.ttl{font-size:28px;color:var(--gold-hi)}
.sub{color:#a9c0b3;margin:0 0 14px;font-size:14px}
.sec{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-size:15px;color:var(--gold);margin:22px 0 10px}
.sec::after{content:"";flex:1;border-top:1px solid rgba(211,177,95,.35)}
.sec span{font-family:var(--f-b);font-size:12px;color:#a9c0b3}
.flag{display:inline-block;overflow:hidden;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.18);vertical-align:middle;flex:none}
.flag svg{display:block;width:100%;height:100%}
.ph{background:#7f8f86;color:#fff;font:700 8px/1 var(--f-c);display:inline-grid;place-items:center}
svg.stamp{mix-blend-mode:multiply;overflow:visible;display:block;opacity:.92}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- حالات ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 10px;font-size:12px;font-weight:600;line-height:1.8;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-ontime{background:var(--ok-bg);color:var(--ok)}.c-delayed{background:var(--warn-bg);color:var(--warn)}.c-cancelled{background:var(--bad-bg);color:var(--bad)}.c-landed{background:var(--info-bg);color:var(--info)}.c-boarding{background:var(--ok-bg);color:var(--ok)}

/* ---------- تذكرة الصعود ---------- */
.bp{background:var(--paper);color:var(--ink);border-radius:22px;position:relative;box-shadow:0 22px 30px -20px #000;overflow:hidden}
.bp-top{background:var(--cover-2);color:var(--gold);display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:2px solid var(--gold)}
.bp-top b{font-family:var(--f-c);font-size:22px;letter-spacing:.04em;color:var(--gold-hi)}
.bp-top span{font-size:13px}
.bp-mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:16px 18px 6px}
.pt{display:flex;flex-direction:column}
.pt.end{align-items:flex-end}
.code{font-family:var(--f-c);font-weight:700;font-size:58px;line-height:1;letter-spacing:.02em;direction:ltr;display:flex;gap:3px}
.code i{font-style:normal;background:var(--ink);color:#f4f1dc;border-radius:6px;padding:0 6px 3px;position:relative;box-shadow:inset 0 -2px 0 rgba(255,255,255,.06)}
.code i::after{content:"";position:absolute;inset-inline:0;top:50%;border-top:1.5px solid #000;opacity:.6}
.cty{font-weight:600;font-size:14px;margin-top:2px}
.path{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;min-width:64px}
.path .ln{display:flex;align-items:center;width:100%;color:var(--cover)}
.path .ln::before,.path .ln::after{content:"";flex:1;border-top:2px dashed #9aa890}
.path svg{width:22px;height:22px;transform:rotate(-90deg);flex:none;margin-inline:2px}
.bp-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:10px 18px 16px}
.bp-info div small{display:block;font-size:11px;color:var(--muted)}
.bp-info div b{font-family:var(--f-c);font-size:21px;line-height:1.2;letter-spacing:.02em;direction:ltr;display:block;text-align:right}
.bp-info div b.ar{font-family:var(--f-b);font-size:14px;font-weight:600;direction:rtl;padding-top:3px}
.perf{position:relative;border-top:2px dashed #b3bba5;margin:0 14px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--cover)}
.perf::before{inset-inline-start:-25px}.perf::after{inset-inline-end:-25px}
.bp-bot{padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px}
.cd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cd b{font-family:var(--f-d);font-size:24px;line-height:1.2;color:var(--cover)}
.bar{height:32px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px,var(--ink) 13px 14px,transparent 14px 17px);opacity:.78}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;border-radius:999px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);color:var(--ink);background:none}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0e2b23}
.btn.dark{background:var(--cover);border-color:var(--cover);color:var(--gold-hi)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn .ico{width:18px;height:18px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.empty{background:rgba(255,255,255,.06);border:1.5px dashed rgba(211,177,95,.5);border-radius:20px;padding:22px 18px;text-align:center;color:#c9d8ce}
.empty h3{font-size:17px;color:var(--gold-hi);margin-bottom:4px}
.empty p{margin:0 0 14px}

/* ---------- قوائم ---------- */
.seg{display:flex;gap:6px;background:rgba(0,0,0,.25);border-radius:999px;padding:4px;margin:6px 0 4px}
.seg button{flex:1;min-height:40px;border-radius:999px;color:#b9cdc1;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--gold);color:#0e2b23}
.trip{margin-top:16px}
.trip-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.trip-h b{font-family:var(--f-d);font-size:15px;color:var(--gold-hi)}
.trip-h small{color:#a9c0b3;font-size:12px}
.fr{width:100%;background:var(--paper);color:var(--ink);border-radius:16px;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 12px;text-align:start;margin-bottom:8px;box-shadow:0 10px 16px -14px #000}
.fr .dt{background:var(--cover);color:var(--gold-hi);border-radius:12px;text-align:center;padding:3px 0;line-height:1.1}
.fr .dt b{display:block;font-family:var(--f-c);font-size:22px}.fr .dt span{font-size:11px}
.fr .rt{min-width:0}
.fr .rt .cds{font-family:var(--f-c);font-weight:700;font-size:22px;letter-spacing:.03em;direction:ltr;display:flex;align-items:center;gap:6px}
.fr .rt .cds svg{width:16px;height:16px;transform:rotate(-90deg);color:var(--muted)}
.fr .rt small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.fr .stt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* ---------- اقتراحات ---------- */
.ribbon{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin-inline:-2px}
.ribbon::-webkit-scrollbar{display:none}
.ribbon button{flex:none;min-height:38px;border:1px solid rgba(211,177,95,.55);border-radius:999px;padding:0 16px;color:var(--gold)}
.ribbon button[aria-pressed="true"]{background:var(--gold);color:#0e2b23;border-color:var(--gold);font-weight:700}
.visa{position:relative;background:var(--paper);color:var(--ink);border-radius:16px;display:flex;overflow:hidden;margin-bottom:10px;box-shadow:0 12px 18px -14px #000}
.visa::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 6px,rgba(31,107,74,.05) 6px 7px)}
.visa .main{position:relative;flex:1;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.visa .nm{font-family:var(--f-d);font-size:20px;font-weight:700;line-height:1.3}
.visa .ct{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.visa .rs{font-size:13.5px;color:#34463e}
.visa .side{position:relative;width:78px;border-inline-start:2px dotted var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.visa .side b{font-family:var(--f-c);font-size:30px;line-height:1;color:var(--cover)}
.visa .side span{font-size:11px;color:var(--muted)}
.note{font-size:12.5px;color:#a9c0b3;margin-top:6px}

/* ---------- إحصاءات ---------- */
.paper{background:var(--paper);color:var(--ink);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 12px 18px -14px #000}
.big{font-family:var(--f-c);font-weight:700;font-size:64px;line-height:1;letter-spacing:.01em;color:var(--cover)}
.big small{font-family:var(--f-b);font-size:15px;font-weight:600;color:var(--muted);margin-inline-start:6px}
.meter{height:10px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--cover);border-radius:99px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 10px 16px -14px #000}
.st b{font-family:var(--f-c);font-size:34px;line-height:1.1;display:block;color:var(--cover)}
.st span{font-size:13px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.chart i{display:block;width:100%;background:var(--cover);border-radius:6px 6px 2px 2px;min-height:3px}
.chart em{font-style:normal;font-size:10.5px;color:var(--muted);white-space:nowrap}
.chart b{font-family:var(--f-c);font-size:13px}
.top{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.top li{display:flex;align-items:center;gap:10px}
.top .n{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.top .cds{font-family:var(--f-c);font-weight:700;font-size:19px;direction:ltr;letter-spacing:.03em}
.top .v{font-family:var(--f-c);font-weight:700;font-size:18px;color:var(--cover)}
.top small{color:var(--muted)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill-row button{min-height:36px;border-radius:999px;padding:0 14px;border:1px solid rgba(211,177,95,.55);color:var(--gold);font-size:13px}
.pill-row button[aria-pressed="true"]{background:var(--gold);color:#0e2b23;border-color:var(--gold);font-weight:700}

/* ---------- جواز ---------- */
.data{position:relative;background:var(--paper);color:var(--ink);border-radius:20px;overflow:hidden;margin-bottom:12px;box-shadow:0 18px 26px -18px #000}
.guil{position:absolute;inset:0;opacity:.55;pointer-events:none}
.data>*{position:relative}
.data>.guil{position:absolute}
.dh{background:var(--cover-2);color:var(--gold);padding:10px 18px;border-bottom:2px solid var(--gold);font-family:var(--f-d);font-size:14px}
.pf{display:flex;gap:14px;align-items:center;padding:16px 18px 8px}
.photo{width:74px;height:90px;border-radius:8px;background:linear-gradient(160deg,#2c6a58,#123f35);border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--f-d);font-size:34px;color:var(--gold-hi);flex:none}
.pf input{width:100%;font-family:var(--f-d);font-size:24px;font-weight:700;background:none;border:0;border-bottom:1.5px dashed #9aa890;color:var(--ink);padding:0 0 2px;border-radius:0;min-height:40px}
.pf p{margin:2px 0 0;color:var(--muted);font-size:13px}
.lv{display:inline-block;margin-top:4px;background:var(--cover);color:var(--gold-hi);border-radius:999px;padding:0 12px;font-size:12px}
.home-sel{display:flex;gap:8px;align-items:center;padding:0 18px 6px;font-size:13px;color:var(--muted)}
.home-sel select{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.6);padding:0 8px;color:var(--ink)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);border-block:1.5px solid var(--ink);margin:8px 18px;padding:6px 0}
.stats3 div{text-align:center}.stats3 div+div{border-inline-start:1px solid var(--line)}
.stats3 b{display:block;font-family:var(--f-c);font-size:30px;line-height:1.1}.stats3 span{font-size:12px;color:var(--muted)}
.fl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:6px 18px 8px}
.fl{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:12px;padding:8px 4px 6px;font-size:13px;font-weight:600;line-height:1.35}
.fl .flag{width:44px;height:30px}
.fl small{font-weight:400;color:var(--muted);font-size:11px}
.fl.plan{border-style:dashed;background:transparent}
.fl.plan .flag{opacity:.55}
.mrz{direction:ltr;text-align:left;font:600 11px/1.35 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:#55655b;padding:6px 14px 12px;overflow:hidden;white-space:nowrap}
.pgs{position:relative;background:var(--paper);border-radius:20px;height:440px;overflow:hidden;box-shadow:0 18px 26px -18px #000;color:var(--ink)}
.pgs .stampbox{position:absolute}
.pn{position:absolute;top:10px;inset-inline:14px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.pn b{font-family:var(--f-d);font-size:15px}
.pn button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;background:rgba(255,255,255,.4)}
.pn button:disabled{opacity:.35;cursor:default}
.pn .ico{width:18px;height:18px}
.slot{position:absolute;color:#7f8d78}
.sm-box{background:rgba(0,0,0,.22);border-radius:16px;padding:14px;margin-top:12px;font-size:13px;color:#c0d3c7}
.sm-box b{color:var(--gold-hi)}
.sm-box .btns{margin-top:10px}
.sm-box .btn{color:var(--gold-hi);border-color:rgba(211,177,95,.6)}

/* ---------- تنقّل ---------- */
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 24px));height:62px;border-radius:999px;border:1px solid rgba(211,177,95,.55);background:rgba(8,32,26,.92);backdrop-filter:blur(8px);display:flex;justify-content:space-around;align-items:center;z-index:30}
.nav button{display:grid;justify-items:center;color:#8da99a;font-size:11px;min-width:54px;min-height:48px;align-content:center;border-radius:999px}
.nav button[aria-current="page"]{color:var(--gold-hi)}
.fab{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,calc(50% - 224px));z-index:29;min-height:52px;border-radius:999px;background:var(--gold);color:#0e2b23;font-weight:700;padding:0 20px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 22px -10px #000}
.fab .ico{width:20px;height:20px}

/* ---------- نموذج ---------- */
.veil{position:fixed;inset:0;background:rgba(3,15,12,.66);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);color:var(--ink);width:min(480px,100%);max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet h2{font-size:20px}
.sheet label{display:grid;gap:3px;font-size:13px;font-weight:600;color:var(--muted)}
.sheet input,.sheet select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;color:var(--ink);width:100%}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .hint{font-weight:400;font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:20px}
.sheet .row-btn{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.ltr{direction:ltr;text-align:left}
.toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#0e2b23;border-radius:999px;padding:6px 18px;z-index:60;font-weight:600;font-size:14px}


/* ================= المدونة ================= */
.visa .vp{position:relative;width:86px;flex:none;background:linear-gradient(160deg,var(--cover-3),var(--cover)) center/cover no-repeat}
.pc{width:100%;display:flex;gap:0;background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;text-align:start;margin-bottom:10px;box-shadow:0 12px 18px -14px #000}
.pc .cv{width:112px;flex:none;background:linear-gradient(160deg,var(--cover-3),var(--cover)) center/cover no-repeat;min-height:112px}
.pc .in{padding:10px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.pc h3{font-size:16px;line-height:1.45}
.pc p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .mt{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:auto;flex-wrap:wrap}
.alb{column-count:2;column-gap:8px}
.alb figure{margin:0 0 8px;break-inside:avoid;border-radius:14px;overflow:hidden;background:var(--cover-2);position:relative;cursor:pointer}
.alb img{display:block;width:100%;height:auto}
.alb figcaption{position:absolute;inset-inline:0;bottom:0;padding:16px 8px 6px;font-size:11.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}

/* نافذة التدوينة (قراءة وتحرير) */
.ovw{position:fixed;inset:0;z-index:45;overflow:auto;background:var(--board);overscroll-behavior:contain}
.ovw>.app{min-height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.edbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cover);margin:-18px -16px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid rgba(211,177,95,.35)}
.edbar b{font-family:var(--f-d);color:var(--gold-hi)}
.edbar .btn{border-color:rgba(211,177,95,.6);color:var(--gold-hi)}
.edbar .btn.gold{color:#0e2b23;background:var(--gold);border-color:var(--gold)}
.fld{display:grid;gap:3px;font-size:13px;font-weight:600;color:#a9c0b3;margin-bottom:10px}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border-radius:12px;border:1.5px solid rgba(211,177,95,.4);background:rgba(0,0,0,.25);color:#f2f6f2;padding:0 12px;font-weight:400}
.fld textarea{padding:10px 12px;min-height:90px;line-height:1.8;resize:none;font-size:15px}
.fld.big input{font-family:var(--f-d);font-size:22px;font-weight:700;min-height:56px;color:var(--gold-hi)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tgs button{min-height:36px;border-radius:999px;border:1px solid rgba(211,177,95,.5);padding:0 12px;color:var(--gold);font-size:13px}
.tgs button[aria-pressed="true"]{background:var(--gold);color:#0e2b23;border-color:var(--gold);font-weight:700}
.bk{background:var(--paper);color:var(--ink);border-radius:18px;padding:12px;margin-bottom:12px;display:grid;gap:10px;box-shadow:0 10px 16px -14px #000}
.bkh{display:flex;justify-content:space-between;align-items:center}
.bkh>span{font-family:var(--f-d);font-size:13px;color:var(--cover)}
.bkh div{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink);background:#fff}
.ib:disabled{opacity:.35}
.ib .ico{width:16px;height:16px}
.rt90 .ico{transform:rotate(90deg)}.rt-90 .ico{transform:rotate(-90deg)}
.bk input,.bk select,.bk textarea{width:100%;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:0 10px;min-height:44px}
.bk textarea{padding:8px 10px;line-height:1.8;resize:none;min-height:80px}
.bk .two2{gap:8px}
.stars{display:flex;gap:4px}
.stars button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-c);font-weight:700;font-size:18px;background:#fff}
.stars button[aria-pressed="true"]{background:var(--cover);color:var(--gold-hi);border-color:var(--cover)}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tpls button{display:grid;justify-items:center;gap:2px;border:1.5px solid var(--line);border-radius:12px;padding:6px 2px;font-size:11px;background:#fff;color:var(--ink);min-height:56px}
.tpls button[aria-pressed="true"]{border-color:var(--cover);background:var(--cover);color:var(--gold-hi)}
.tpls svg{width:38px;height:26px;fill:currentColor;opacity:.85}
.pths{display:grid;gap:8px}
.pth{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center}
.pth img{width:64px;height:48px;object-fit:cover;border-radius:8px;display:block;background:#ccd}
.pth .ctl{display:flex;gap:2px}
.pth .ib{width:36px;height:36px}
.addbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;background:rgba(8,32,26,.95);border:1px solid rgba(211,177,95,.5);border-radius:22px;padding:8px;margin-top:10px;z-index:4}
.addbar button{min-height:40px;border-radius:999px;padding:0 12px;color:var(--gold-hi);border:1px solid rgba(211,177,95,.4);font-size:13px;font-weight:600}
.addbar .ico{width:16px;height:16px}
.addbar button:first-child{background:var(--gold);color:#0e2b23;border-color:var(--gold)}
.prev{border:1.5px dashed var(--line);border-radius:12px;padding:8px;background:#0f3a30}
.prev .phg{margin:0}

/* قراءة */
.pr-hero{position:relative;height:290px;margin:-18px -16px 0;background:linear-gradient(160deg,var(--cover-3),var(--cover)) center/cover no-repeat;border-radius:0 0 28px 28px;overflow:hidden;color:#fff}
.pr-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,22,18,.9),rgba(5,22,18,.15) 60%,rgba(5,22,18,.35))}
.pr-hero>*{position:absolute;z-index:1}
.pr-top{top:calc(10px + env(safe-area-inset-top,0px));inset-inline:14px;display:flex;justify-content:space-between;gap:8px}
.pr-top .btn{background:rgba(8,32,26,.7);color:var(--gold-hi);border-color:rgba(211,177,95,.6)}
.pr-ttl{bottom:16px;inset-inline:18px}
.pr-ttl h1{font-size:28px;line-height:1.35;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.pr-ttl small{display:flex;gap:8px;align-items:center;color:#dfe9e1;margin-top:4px;flex-wrap:wrap}
.fsum{background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 14px;margin:14px 0;display:grid;gap:4px;font-size:13px}
.fsum .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fsum b{font-family:var(--f-c);font-size:17px;letter-spacing:.03em;direction:ltr}
.fsum small{color:var(--muted)}
.b-h{font-family:var(--f-d);font-size:21px;line-height:1.5;color:var(--gold-hi);margin:26px 0 4px}
.b-p{font-size:16.5px;line-height:2;color:#e6efe8;white-space:pre-wrap;margin:8px 0;max-width:38em}
.b-q{margin:18px 0;border-inline-start:3px solid var(--gold);padding:2px 14px;font-family:var(--f-d);font-size:18px;line-height:1.8;color:var(--gold-hi);white-space:pre-wrap}
.b-tip{margin:16px 0;background:rgba(211,177,95,.12);border:1.5px dashed rgba(211,177,95,.6);border-radius:16px;padding:12px 14px;white-space:pre-wrap;line-height:1.9}
.b-tip b{display:block;font-family:var(--f-d);color:var(--gold);font-size:13px;margin-bottom:2px}
.b-place{margin:16px 0;background:var(--paper);color:var(--ink);border-radius:18px;padding:12px 14px;display:grid;gap:4px;box-shadow:0 12px 18px -14px #000}
.b-place h3{font-size:17px}
.b-place .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.b-place .r .chip{background:var(--cover);color:var(--gold-hi)}
.b-place .r .chip::before{display:none}
.b-place .st5{font-family:var(--f-c);font-weight:700;font-size:18px;color:var(--cover);letter-spacing:.02em}
.b-place p{margin:0;font-size:14px;white-space:pre-wrap;line-height:1.85}
.pr-tags{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 6px}
.pr-tags span{border:1px solid rgba(211,177,95,.5);color:var(--gold);border-radius:999px;padding:0 12px;font-size:12.5px}
.cr{font-size:11.5px;color:#92aa9d;margin:6px 0 0}
.rd-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.rd-act .btn{color:var(--gold-hi);border-color:rgba(211,177,95,.6)}
.rd-act .btn.bad{color:#f1a39c;border-color:#c77}

/* قوالب الصور */
.phg{display:grid;gap:6px;margin:14px 0}
.phg figure{margin:0;position:relative;overflow:hidden;border-radius:12px;background:#0e342b;cursor:zoom-in}
.phg img{width:100%;height:100%;object-fit:cover;display:block}
.phg figcaption{position:absolute;inset-inline:0;bottom:0;padding:18px 10px 7px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));line-height:1.5}
.phg.single{grid-template-columns:1fr}.phg.single figure{aspect-ratio:4/3}
.phg.duo{grid-template-columns:1fr 1fr}.phg.duo figure{aspect-ratio:3/4}
.phg.trio{grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:4/3}
.phg.trio figure:first-child{grid-row:1/3}
.phg.grid{grid-template-columns:1fr 1fr}.phg.grid figure{aspect-ratio:1}
.phg.mosaic{grid-template-columns:repeat(3,1fr);grid-auto-rows:88px;grid-auto-flow:dense}
.phg.mosaic figure:nth-child(5n+1){grid-column:span 2;grid-row:span 2}
.phg.mosaic figure:nth-child(5n+3){grid-row:span 2}
.phg.mosaic figure:nth-child(5n+5){grid-column:span 2}
.phg.polaroid{display:flex;flex-wrap:wrap;justify-content:center;gap:0;padding:6px 0}
.phg.polaroid figure{width:47%;margin:8px 1.5%;background:#fbf9f1;padding:7px 7px 34px;border-radius:3px;box-shadow:0 10px 18px -8px rgba(0,0,0,.6);transform:rotate(var(--r,-2deg));overflow:visible}
.phg.polaroid figure:nth-child(4n+1){--r:-3deg}.phg.polaroid figure:nth-child(4n+2){--r:2.5deg;margin-top:20px}.phg.polaroid figure:nth-child(4n+3){--r:1.5deg}.phg.polaroid figure:nth-child(4n+4){--r:-2.5deg;margin-top:20px}
.phg.polaroid img{aspect-ratio:1;height:auto;border-radius:1px}
.phg.polaroid figcaption{background:none;color:#37423c;font-size:12px;text-align:center;padding:0 6px;bottom:8px;font-weight:600}
.phg.strip{display:flex;overflow-x:auto;gap:8px;background:#0b0b0a;padding:20px 10px;border-radius:8px;scroll-snap-type:x proximity;position:relative}
.phg.strip figure{flex:none;width:190px;aspect-ratio:3/2;border-radius:3px;scroll-snap-align:start}
.phg.strip::before,.phg.strip::after{content:"";position:absolute;inset-inline:0;height:8px;background:repeating-linear-gradient(90deg,#3b3b36 0 8px,transparent 8px 16px);opacity:.9}
.phg.strip::before{top:6px}.phg.strip::after{bottom:6px}

/* عارض الصور */
.lb{position:fixed;inset:0;z-index:70;background:rgba(2,10,8,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 12px calc(20px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:72dvh;object-fit:contain;border-radius:8px}
.lb .lbc{color:#dfe9e1;font-size:14px;text-align:center;max-width:34em;min-height:44px}
.lb .lbc small{display:block;color:#92aa9d;font-size:11.5px}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:14px}
.lb .nv{display:flex;gap:10px;align-items:center;color:#dfe9e1}
.lb .nv button{width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(211,177,95,.6);color:var(--gold-hi);display:grid;place-items:center}

/* منتقي صور الإنترنت */
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:44dvh;overflow:auto}
.pk button{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#cdd5c4;padding:0}
.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk button[aria-pressed="true"]{outline:4px solid var(--cover);outline-offset:-4px}
.pk button[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;background:var(--cover);color:var(--gold-hi);display:grid;place-items:center;font-size:14px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stg button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:start;min-height:60px}
.stg button b{display:block;font-family:var(--f-d);font-size:14px;color:var(--cover)}
.stg button small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.stg button[aria-pressed="true"]{border-color:var(--cover);background:#e3efe3}

@media (prefers-reduced-motion:no-preference){
  .flip i{animation:fl .7s calc(var(--d)*70ms) cubic-bezier(.3,.9,.3,1) both;transform-origin:50% 50%}
  @keyframes fl{0%{transform:rotateX(-100deg);opacity:0}60%{transform:rotateX(12deg);opacity:1}100%{transform:none}}
  .stampin{animation:ink .45s cubic-bezier(.2,1.4,.4,1) both}@keyframes ink{from{transform:scale(1.3);opacity:0}}
}
@media (min-width:600px){.app{margin-block:0}}
.app{padding-top:calc(18px + env(safe-area-inset-top,0px))}
</style>

function submitFlight(e){
  e.preventDefault();
  const id=e.target.dataset.id,no=$("#f-no").value.trim().toUpperCase().replace(/^([A-Z0-9]{2})\s*(\d)/,"$1 $2"),date=$("#f-date").value,from=$("#f-from").value,to=$("#f-to").value;
  const err=m=>{$("#err").textContent=m;return false};
  if(!/^[A-Z0-9]{2} ?\d{1,4}[A-Z]?$/.test(no))return err("اكتب رقم الرحلة بالشكل: رمز الشركة ثم الرقم، مثل SV 1051.");
  if(!date)return err("اختر تاريخ الرحلة.");
  if(!to)return err("اختر مطار الوصول.");
  if(from===to)return err("مطار الوصول يجب أن يختلف عن مطار الإقلاع.");
  let trip=$("#f-trip").value;
  if(!trip){const y=new Date(date).getFullYear(),home=AP[S.home].cc,dest=AP[to].cc!==home?AP[to]:AP[from];trip=`${dest.city} ${y}`}
  const o={id:id||("u"+Date.now().toString(36)),no,date,time:$("#f-time").value||"09:00",from,to,trip,status:$("#f-st").value,delay:+($("#f-dl").value||0),seat:$("#f-seat").value.trim(),gate:$("#f-gate").value.trim(),term:$("#f-term").value.trim()};
  if(o.status!=="delayed")o.delay=0;
  if(id)S.flights=S.flights.map(f=>f.id===id?o:f);else S.flights.push(o);
  S.sample=S.sample&&S.flights.every(f=>/^s\d+$/.test(f.id));
  save();$("#layer").innerHTML="";ui.tab="flights";ui.seg=isPast(o)?"past":"up";render();toast(id?"تم حفظ الرحلة":"أُضيفت الرحلة");
}

/* --- تخزين الصور في IndexedDB --- */
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open("wijha-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=async(mode,fn)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("p",mode),o=fn(t.objectStore("p"));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)})};
const putPhoto=r=>tx("readwrite",s=>s.put(r)).catch(()=>toast("تعذّر حفظ الصورة على الجهاز"));
const delPhoto=id=>tx("readwrite",s=>s.delete(id)).catch(()=>{});
async function loadMedia(){try{const all=await tx("readonly",s=>s.getAll())||[];all.forEach(r=>regMedia(r))}catch(e){}}
function regMedia(r){MEDIA[r.id]={url:r.remote||URL.createObjectURL(r.blob),credit:r.credit||"",w:r.w,h:r.h}}
const rid=()=>"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function compress(file){
  const bmp=await createImageBitmap(file),s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r({blob:b,w:c.width,h:c.height}),"image/jpeg",.82));
}
function gc(){
  const used=new Set();POSTS.forEach(p=>{if(p.cover)used.add(p.cover);p.blocks.forEach(b=>b.t==="ph"&&b.items.forEach(i=>used.add(i.id)))});
  Object.keys(MEDIA).forEach(id=>{if(!used.has(id)){try{URL.revokeObjectURL(MEDIA[id].url)}catch(e){}delete MEDIA[id];delPhoto(id)}});
}

/* --- صور تجريبية مرسومة --- */
function genImg(i){return new Promise(res=>{
  const c=document.createElement("canvas");c.width=1200;c.height=800;const g=c.getContext("2d");
  const P=[["#f6a57a","#f7d7a0","#2f4f7f"],["#7fa7f2","#cfe4f6","#2d4ca3"],["#2b3a67","#f0a060","#1a2440"],["#9ad4c8","#f5efd2","#2c7a7b"],["#e8b4c8","#ffd7a8","#5b3a8c"],["#f0c36a","#f7e7b4","#7a4a2a"]][i%6];
  const gr=g.createLinearGradient(0,0,0,800);gr.addColorStop(0,P[0]);gr.addColorStop(.72,P[1]);g.fillStyle=gr;g.fillRect(0,0,1200,800);
  g.fillStyle=P[1];g.beginPath();g.arc(260+i*130,250,74,0,7);g.fill();
  g.fillStyle=P[2];g.globalAlpha=.55;g.beginPath();g.moveTo(0,800);g.lineTo(0,540);for(let x=0;x<=1200;x+=40)g.lineTo(x,500+Math.sin(x/120+i)*50);g.lineTo(1200,800);g.fill();g.globalAlpha=1;
  g.fillStyle=P[2];
  if(i%3===0){for(let k=0;k<3;k++){const x=420+k*190;g.fillRect(x-60,560,120,240);g.beginPath();g.arc(x,560,60,Math.PI,0);g.fill();g.fillRect(x-4,470,8,40)}}
  else if(i%3===1){for(let k=0;k<2;k++){const x=520+k*260;g.beginPath();g.moveTo(x,360);g.lineTo(x,700);g.lineTo(x+170,700);g.fill();g.fillRect(x-60,700,260,20)}}
  else{for(let k=0;k<2;k++){const x=300+k*560;g.fillRect(x,330,40,470);g.beginPath();g.moveTo(x-6,330);g.lineTo(x+20,250);g.lineTo(x+46,330);g.fill()}g.beginPath();g.arc(600,720,150,Math.PI,0);g.fill()}
  c.toBlob(b=>res({blob:b,w:1200,h:800}),"image/jpeg",.85)})}

   <div class="row-btn"><button class="btn gold" data-a="npgo">ابدأ الكتابة</button><button class="btn" data-a="close">إلغاء</button></div></div></div>`;
}
Object.assign(A,{
 jseg(v){ui.jseg=v;render(1)},
 newpost(){newPostSheet("")},
 postfor(v){newPostSheet(decodeURIComponent(v))},
 stk(v){pending.k=v;document.querySelectorAll('[data-a="stk"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v))},
 npgo(){const t=$("#np-trip").value;$("#layer").innerHTML="";openEditor(newPost(t,pending.k),true)},
 openpost(v,el){openPost(el.dataset.id)},
 rdclose(){closeOv()},
 "edit-post"(v,el){const p=POSTS.find(x=>x.id===el.dataset.id);closeOv();openEditor(p,false)},
 "del-post"(v,el){if(el.dataset.sure){POSTS=POSTS.filter(x=>x.id!==el.dataset.id);savePosts();gc();closeOv();render(1);toast("حُذفت التدوينة")}else{el.dataset.sure=1;el.textContent="اضغط للتأكيد"}},
 "share-post"(v,el){const p=POSTS.find(x=>x.id===el.dataset.id),text=p.title+"\n\n"+p.blocks.filter(b=>b.text).map(b=>b.text).join("\n\n");if(navigator.share)navigator.share({title:p.title,text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("تم نسخ النص"),()=>toast("تعذّر النسخ"))},
 export(v,el){exportPost(el.dataset.id)},
 edcancel(){closeOv();ui.tab=ui.tab;render(1)},
 edsave(){saveEditor()},
 badd(v){ED.p.blocks.push(NEWB[v]());edRender();const w=$("#ovw");w.scrollTo(0,w.scrollHeight)},
 bdel(v,el){ED.p.blocks.splice(+el.dataset.i,1);edRender()},
 bmv(v,el){const i=+el.dataset.i,j=i+ +el.dataset.v,a=ED.p.blocks;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];edRender()},
 tpl(v,el){ED.p.blocks[+el.dataset.i].tpl=v;edRender()},
 rate(v,el){const b=ED.p.blocks[+el.dataset.i];b.rate=b.rate===+v?0:+v;edRender()},
 ptag(v){const t=ED.p.tags,i=t.indexOf(v);i>=0?t.splice(i,1):t.push(v);edRender()},
 padd(v,el){pending={bi:+el.dataset.i};$("#fi").value="";$("#fi").click()},
 pdel(v,el){ED.p.blocks[+el.dataset.i].items.splice(+el.dataset.j,1);edRender()},
 pmv(v,el){const a=ED.p.blocks[+el.dataset.i].items,i=+el.dataset.j,j=i+ +el.dataset.v;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];edRender()},
 pnet(v,el){const bi=+el.dataset.i;PK={bi,q:tripDest(ED.p.trip)||"",list:[],sel:new Set(),loading:false,err:""};pkRender();if(PK.q)pkSearch()},
 pksearch(){PK.q=$("#pkq").value.trim();PK.sel=new Set();if(PK.q)pkSearch()},
 pkpick(v,el){const i=+el.dataset.i;PK.sel.has(i)?PK.sel.delete(i):PK.sel.add(i);const keep=$(".pk").scrollTop;pkRender();$(".pk").scrollTop=keep},
 pkadd(){pkAdd()},
 pkveil(v,el,e){if(e.target===el)$("#layer").innerHTML=""},
 lb(v,el){const post=POSTS.find(x=>x.id===READ);if(!post)return;const list=photosOf(post);openLB(list,Math.max(0,list.findIndex(x=>x.id===el.dataset.id)))},
 "lb-album"(v,el){const all=POSTS.slice().sort((a,b)=>(b.date||"")>(a.date||"")?1:-1).flatMap(p=>photosOf(p));openLB(all,+el.dataset.i)},
 lbx(){lbClose()},
 lbn(v){LBX.i=(LBX.i+ +v+LBX.list.length)%LBX.list.length;lbRender()}
});
document.addEventListener("input",e=>{
  const el=e.target;if(!ED)return;
  if(el.dataset.f){ED.p[el.dataset.f]=el.value;return}
  if(el.dataset.bi!==undefined){const b=ED.p.blocks[+el.dataset.bi];if(el.dataset.pj!==undefined)b.items[+el.dataset.pj].cap=el.value;else b[el.dataset.k]=el.value;if(el.tagName==="TEXTAREA"){el.style.height="auto";el.style.height=Math.max(el.scrollHeight,80)+"px"}}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="fi"&&ED&&pending&&pending.bi!==undefined){addFiles(pending.bi,[...el.files]);return}
  if(ED&&el.dataset.f){ED.p[el.dataset.f]=el.value}
  if(ED&&el.dataset.bi!==undefined&&el.tagName==="SELECT")ED.p.blocks[+el.dataset.bi][el.dataset.k]=el.value;
});
document.addEventListener("keydown",e=>{
  if(LBX){if(e.key==="Escape")lbClose();if(e.key==="ArrowLeft")A.lbn(1);if(e.key==="ArrowRight")A.lbn(-1);return}
  if(e.key==="Escape"){if($("#layer").innerHTML)$("#layer").innerHTML="";else if($("#ov").innerHTML)closeOv()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pkq"){e.preventDefault();A.pksearch()}});

document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el,e)});
document.addEventListener("submit",e=>{if(e.target.id==="ff")submitFlight(e)});
document.addEventListener("change",e=>{
  if(e.target.id==="nm"){S.name=e.target.value.trim();save();render(1)}
  if(e.target.id==="home"){S.home=e.target.value;save();render(1)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML)$("#layer").innerHTML=""});
setInterval(()=>{const c=$("#cd");if(c){const f=S.flights.find(x=>x.id===c.dataset.id);if(f){const t=countdown(f);c.innerHTML=t?"تقلع بعد "+t:""}}},30000);
render();bootJournal();
</script>
