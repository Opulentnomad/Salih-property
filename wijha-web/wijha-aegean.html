<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f7fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>وجهة رحلاتي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout concept: لغة تصميم «إيجه»: سطح أزرق جليدي، بطاقات بيضاء بحواف مستديرة وظلال ناعمة، غلاف صورة كبير، فقاعات تواريخ باستيل، وزر كحلي عريض.
   Type: Readex Pro للعناوين، IBM Plex Sans Arabic للنص، Barlow Condensed لرموز المطارات.
   Look: تصميم فاتح ملتزم؛ لا وضع داكن منفصل. */
:root{
  --page:#e8eef7; --bg:#f3f7fc; --card:#fff; --ink:#1c2740; --mute:#5f6c85; --acc:#2f5fd0; --soft:#e1eafb; --line:#d9e2f1; --shadow:rgba(32,50,100,.38);
  --b1:#dfe8ff; --b1f:#2b3f8f; --b2:#d4efe9; --b2f:#1f5f58; --b3:#eadfff; --b3f:#5b3a8c;
  --ok:#17663f; --ok-bg:#d3ebdb; --warn:#8a5200; --warn-bg:#f8e6b8; --bad:#a1281f; --bad-bg:#f6d6d1; --info:#27408b; --info-bg:#dfe7fb; --heart:#e5304a;
  --f-d:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-b:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-c:"Barlow Condensed","IBM Plex Sans Arabic",Arial Narrow,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.7;direction:rtl;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-block:18px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 0 70px -20px var(--shadow)}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.35;font-weight:700}
.ttl{font-size:26px}
.sub{color:var(--mute);margin:2px 0 14px;font-size:14px}
.sec{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:700;font-size:16px;margin:22px 0 10px}
.sec::after{content:"";flex:1;border-top:1px solid var(--line)}
.sec span{font-family:var(--f-b);font-weight:400;font-size:12px;color:var(--mute)}
.flag{display:inline-block;overflow:hidden;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.12);vertical-align:middle;flex:none}
.flag svg{display:block;width:100%;height:100%}
.ph{background:#8794ad;color:#fff;font:700 8px/1 var(--f-c);display:inline-grid;place-items:center}
svg.stamp{mix-blend-mode:multiply;overflow:visible;display:block;opacity:.92}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sc{display:block;width:100%;height:100%}

/* حالات */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 10px;font-size:12px;font-weight:600;line-height:1.8;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-ontime,.c-boarding{background:var(--ok-bg);color:var(--ok)}.c-delayed{background:var(--warn-bg);color:var(--warn)}.c-cancelled{background:var(--bad-bg);color:var(--bad)}.c-landed{background:var(--info-bg);color:var(--info)}
.glass{background:rgba(255,255,255,.92);color:var(--ink)}
.glass::before{display:none}.hc .glass::before{display:inline-block;background:var(--acc)}

/* أزرار */
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;border-radius:999px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);color:var(--ink);background:#fff}
.btn.gold,.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 12px 20px -12px var(--shadow)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn .ico{width:18px;height:18px}
.btn.bad{border-color:var(--bad);color:var(--bad);background:#fff}
.btn.full{width:100%}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:22px;padding:22px 18px;text-align:center;color:var(--mute)}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:4px}
.empty p{margin:0 0 14px}
.circ{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 8px 16px -8px var(--shadow);flex:none}

/* الرحلة القادمة: غلاف صورة */
.hc{position:relative;height:236px;border-radius:30px;overflow:hidden;color:#fff;box-shadow:0 20px 30px -18px var(--shadow);background:linear-gradient(160deg,#6f9bf0,#f6c4d8) center/cover no-repeat}
.hc .scn{position:absolute;inset:0}
.hc .ph-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .5s}
.hc .ph-img.on{opacity:1}
.hc::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,16,40,.78),rgba(8,16,40,0) 62%)}
.hc>*{position:absolute;z-index:1}
.hc .tp{top:12px;inset-inline:12px;display:flex;justify-content:space-between;gap:8px}
.hc .bt{bottom:14px;inset-inline:18px}
.hc .code{font-size:52px}
.hc .code i{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(4px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.hc .code i::after{border-color:rgba(0,0,0,.3)}
.hc .rt{display:flex;align-items:center;gap:10px;direction:ltr}
.hc .rt svg{width:26px;height:26px;transform:rotate(90deg);opacity:.9;flex:none}
.hc .mt{display:flex;gap:12px;margin-top:4px;font-size:12.5px;opacity:.95;flex-wrap:wrap}
.code{font-family:var(--f-c);font-weight:700;line-height:1;letter-spacing:.02em;direction:ltr;display:flex;gap:3px}
.code i{font-style:normal;border-radius:7px;padding:0 6px 3px;position:relative}
.code i::after{content:"";position:absolute;inset-inline:0;top:50%;border-top:1.5px solid}
.fd{background:#fff;border-radius:24px;padding:14px 16px;margin-top:12px;box-shadow:0 12px 22px -16px var(--shadow)}
.fd .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.fd .gr small{display:block;font-size:11px;color:var(--mute)}
.fd .gr b{font-family:var(--f-c);font-size:22px;line-height:1.2;letter-spacing:.02em;direction:ltr;display:block;text-align:right}
.fd .gr b.ar{font-family:var(--f-b);font-size:14px;font-weight:600;direction:rtl;padding-top:3px}
.fd .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.cd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.cd b{font-family:var(--f-d);font-size:22px;line-height:1.2;color:var(--acc)}

/* قوائم */
.seg{display:flex;gap:6px;background:#fff;border-radius:999px;padding:4px;margin:16px 0 4px;box-shadow:0 6px 14px -10px var(--shadow)}
.seg button{flex:1;min-height:40px;border-radius:999px;color:var(--mute);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.trip{margin-top:16px}
.trip-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.trip-h .tn{font-family:var(--f-d);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;min-height:36px}
.trip-h .tn .ico{width:14px;height:14px;transform:scaleX(-1);color:var(--mute)}
.trip-h small{color:var(--mute);font-size:12px}
.trip-h .btn{margin-inline-start:auto;min-height:32px;padding:0 12px;font-size:12.5px}
.fr{width:100%;background:#fff;color:var(--ink);border-radius:20px;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:8px 12px 8px 10px;text-align:start;margin-bottom:8px;box-shadow:0 10px 18px -14px var(--shadow)}
.bub{width:46px;height:46px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;line-height:1.05;flex:none}
.bub b{font-family:var(--f-d);font-size:17px;font-weight:700}
.b1{background:var(--b1);color:var(--b1f)}.b2{background:var(--b2);color:var(--b2f)}.b3{background:var(--b3);color:var(--b3f)}
.fr .rt{min-width:0}
.fr .rt .cds{font-family:var(--f-c);font-weight:700;font-size:22px;letter-spacing:.03em;direction:ltr;display:flex;align-items:center;gap:6px}
.fr .rt .cds svg{width:16px;height:16px;transform:rotate(90deg);color:var(--mute)}
.fr .rt small{display:block;color:var(--mute);font-size:12px;line-height:1.4}
.fr .stt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--mute)}

/* اقتراحات */
.ribbon{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin-inline:-2px}
.ribbon::-webkit-scrollbar{display:none}
.ribbon button{flex:none;min-height:40px;border-radius:999px;padding:0 16px;background:#fff;color:var(--ink);font-weight:600;box-shadow:0 4px 10px -6px var(--shadow)}
.ribbon button[aria-pressed="true"]{background:var(--ink);color:#fff}
.visa{position:relative;background:#fff;color:var(--ink);border-radius:22px;display:flex;overflow:hidden;margin-bottom:10px;box-shadow:0 12px 20px -16px var(--shadow)}
.visa .vp{position:relative;width:92px;flex:none;background:linear-gradient(160deg,#6f9bf0,#f6c4d8) center/cover no-repeat}
.visa .main{flex:1;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.visa .nm{font-family:var(--f-d);font-size:19px;font-weight:700;line-height:1.3}
.visa .ct{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px}
.visa .rs{font-size:13.5px;color:#3b4863}
.visa .side{width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--soft)}
.visa .side b{font-family:var(--f-c);font-size:30px;line-height:1;color:var(--acc)}
.visa .side span{font-size:11px;color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);margin-top:6px}

/* إحصاءات */
.paper{background:#fff;color:var(--ink);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 12px 20px -16px var(--shadow)}
.big{font-family:var(--f-c);font-weight:700;font-size:68px;line-height:1;color:var(--acc)}
.big small{font-family:var(--f-b);font-size:15px;font-weight:600;color:var(--mute);margin-inline-start:6px}
.meter{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:99px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{border-radius:20px;padding:12px 14px;background:var(--b1);color:var(--b1f)}
.grid2 .st:nth-child(3n+2){background:var(--b2);color:var(--b2f)}.grid2 .st:nth-child(3n+3){background:var(--b3);color:var(--b3f)}
.st b{font-family:var(--f-c);font-size:36px;line-height:1.1;display:block}
.st span{font-size:13px;opacity:.9}
.chart{display:flex;align-items:flex-end;gap:6px;height:124px;padding-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.chart i{display:block;width:100%;background:var(--acc);border-radius:8px 8px 3px 3px;min-height:3px}
.chart em{font-style:normal;font-size:10.5px;color:var(--mute);white-space:nowrap}
.chart b{font-family:var(--f-c);font-size:13px}
.top{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.top li{display:flex;align-items:center;gap:10px}
.top .n{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.top .cds{font-family:var(--f-c);font-weight:700;font-size:19px;direction:ltr;letter-spacing:.03em}
.top .v{font-family:var(--f-c);font-weight:700;font-size:18px;color:var(--acc)}
.top small{color:var(--mute)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill-row button{min-height:38px;border-radius:999px;padding:0 14px;background:#fff;color:var(--ink);font-size:13px;font-weight:600;box-shadow:0 4px 10px -6px var(--shadow)}
.pill-row button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* جواز */
.data{position:relative;background:#fff;color:var(--ink);border-radius:26px;overflow:hidden;margin-bottom:12px;box-shadow:0 18px 28px -20px var(--shadow)}
.guil{position:absolute;inset:0;opacity:.5;pointer-events:none}
.data>*{position:relative}.data>.guil{position:absolute}
.dh{background:var(--ink);color:#fff;padding:10px 18px;font-family:var(--f-d);font-size:14px}
.pf{display:flex;gap:14px;align-items:center;padding:16px 18px 8px}
.photo{width:80px;height:80px;border-radius:50%;background:linear-gradient(150deg,var(--acc),var(--ink));display:grid;place-items:center;font-family:var(--f-d);font-size:34px;color:#fff;flex:none;box-shadow:0 0 0 4px #fff,0 12px 20px -10px var(--shadow)}
.pf input{width:100%;font-family:var(--f-d);font-size:24px;font-weight:700;background:none;border:0;border-bottom:1.5px dashed var(--line);color:var(--ink);padding:0 0 2px;border-radius:0;min-height:40px}
.pf p{margin:2px 0 0;color:var(--mute);font-size:13px}
.lv{display:inline-block;margin-top:4px;background:var(--soft);color:var(--acc);border-radius:999px;padding:0 12px;font-size:12px;font-weight:700}
.home-sel{display:flex;gap:8px;align-items:center;padding:0 18px 6px;font-size:13px;color:var(--mute)}
.home-sel select{flex:1;min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 8px;color:var(--ink)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 18px}
.stats3 div{text-align:center;border-radius:18px;padding:8px 4px;background:var(--b1);color:var(--b1f)}
.stats3 div:nth-child(2){background:var(--b2);color:var(--b2f)}.stats3 div:nth-child(3){background:var(--b3);color:var(--b3f)}
.stats3 b{display:block;font-family:var(--f-c);font-size:30px;line-height:1.1}.stats3 span{font-size:12px}
.fl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:6px 18px 12px}
.fl{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg);border-radius:16px;padding:8px 4px 6px;font-size:13px;font-weight:600;line-height:1.35}
.fl .flag{width:44px;height:30px}
.fl small{font-weight:400;color:var(--mute);font-size:11px}
.fl.plan{border:1.5px dashed var(--line);background:transparent}
.fl.plan .flag{opacity:.55}
.mrz{direction:ltr;text-align:left;font:600 11px/1.35 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:#8e9bb5;padding:4px 14px 12px;overflow:hidden;white-space:nowrap}
.pgs{position:relative;background:#fff;border-radius:26px;height:440px;overflow:hidden;box-shadow:0 18px 28px -20px var(--shadow);color:var(--ink)}
.pgs .stampbox{position:absolute}
.pn{position:absolute;top:10px;inset-inline:14px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.pn b{font-family:var(--f-d);font-size:15px}
.pn button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--acc)}
.pn button:disabled{opacity:.35;cursor:default}
.pn .ico{width:18px;height:18px}
.slot{position:absolute;color:#9aa9c6}
.sm-box{background:#fff;border-radius:22px;padding:14px 16px;margin-top:12px;font-size:13px;color:var(--mute);box-shadow:0 10px 18px -16px var(--shadow)}
.sm-box b{color:var(--ink)}
.sm-box .btns{margin-top:10px}

/* تنقّل */
.nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(448px,calc(100% - 24px));height:64px;border-radius:999px;background:#fff;box-shadow:0 18px 32px -12px var(--shadow);display:flex;justify-content:space-around;align-items:center;z-index:30}
.nav button{display:grid;justify-items:center;color:var(--mute);font-size:10.5px;min-width:54px;min-height:52px;align-content:center;gap:0}
.nav .ni{width:40px;height:34px;border-radius:999px;display:grid;place-items:center}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"] .ni{background:var(--ink);color:#fff}
.nav .ico{width:21px;height:21px}
.fab{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,calc(50% - 224px));z-index:29;min-height:52px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;padding:0 20px;display:flex;align-items:center;gap:8px;box-shadow:0 14px 24px -10px var(--shadow)}
.fab .ico{width:20px;height:20px}

/* نماذج */
.veil{position:fixed;inset:0;background:rgba(18,28,56,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;color:var(--ink);width:min(480px,100%);max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet h2{font-size:20px}
.sheet label{display:grid;gap:3px;font-size:13px;font-weight:600;color:var(--mute)}
.sheet input,.sheet select{min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;color:var(--ink);width:100%}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .hint{font-weight:400;font-size:12px;color:var(--mute)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:20px}
.sheet .row-btn{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.ltr{direction:ltr;text-align:left}
.toast{position:fixed;bottom:calc(160px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 18px;z-index:80;font-weight:600;font-size:14px}

/* ================= المدونة ================= */
.pc{width:100%;display:flex;background:#fff;color:var(--ink);border-radius:22px;overflow:hidden;text-align:start;margin-bottom:10px;box-shadow:0 12px 20px -16px var(--shadow)}
.pc .cv{width:112px;flex:none;background:linear-gradient(160deg,#6f9bf0,#f6c4d8) center/cover no-repeat;min-height:112px}
.pc .in{padding:10px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.pc h3{font-size:16px;line-height:1.45}
.pc p{margin:0;font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .mt{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-top:auto;flex-wrap:wrap}
.alb{column-count:2;column-gap:8px}
.alb figure{margin:0 0 8px;break-inside:avoid;border-radius:18px;overflow:hidden;background:var(--soft);position:relative;cursor:pointer;box-shadow:0 10px 18px -14px var(--shadow)}
.alb img{display:block;width:100%;height:auto}
.alb figcaption{position:absolute;inset-inline:0;bottom:0;padding:16px 8px 6px;font-size:11.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.ovw{position:fixed;inset:0;z-index:45;overflow:auto;background:var(--bg);overscroll-behavior:contain}
.ovw>.app{min-height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px));box-shadow:none}
.edbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);margin:-18px -16px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.edbar b{font-family:var(--f-d)}
.fld{display:grid;gap:3px;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:10px}

function groups(list,desc){

  const home=AP[S.home]?AP[S.home].cc:"sa";
  return arr.map(([n,fs])=>{
    const ccs=[...new Set(fs.map(f=>AP[f.to].cc))].filter(c=>c!==home),tk=fs.reduce((a,f)=>a+km(f.from,f.to),0);
    return `<section class="trip"><div class="trip-h">${ccs.map(c=>flag(c,24,16)).join("")}<button class="tn" data-a="trip" data-v="${encodeURIComponent(n)}">${esc(n)}${ico("arr")}</button><small>${fs.length} ${fs.length>1?"رحلات":"رحلة"} · ${num(tk)} كم</small><button class="btn sm" data-a="postfor" data-v="${encodeURIComponent(n)}">${ico("pen")}تدوينة</button></div>${fs.map(frow).join("")}</section>`;

function bars(items,max){return `<div class="chart" role="img" aria-label="رسم بياني">${items.map(([l,v])=>`<div><b>${ui.metric==="n"?v:(v>=1000?(v/1000).toFixed(1)+"k":v)}</b><i style="height:${max?Math.max(3,v/max*80):3}px"></i><em>${l}</em></div>`).join("")}</div>`}
function vStats(){
  const all=stats("all"),yrs=[...new Set(past().map(f=>new Date(f.date).getFullYear()))].sort((a,b)=>b-a);
  if(ui.yr!=="all"&&!yrs.includes(+ui.yr))ui.yr="all";

  h+=`<div class="grid2"><div class="st"><b>${s.n}</b><span>رحلة</span></div><div class="st"><b>${fmtH(s.h)}</b><span>ساعة في الجو ≈</span></div><div class="st"><b>${s.ct.size}</b><span>دولة</span></div><div class="st"><b>${s.ap.size}</b><span>مطار</span></div><div class="st"><b>${s.al.size}</b><span>شركة طيران</span></div><div class="st"><b>${num(s.km/s.n)}</b><span>كم متوسط الرحلة</span></div></div>`;
  let items,max;

  max=Math.max(...items.map(x=>x[1]));
  h+=`<div class="sec" style="margin-top:20px">${ui.yr==="all"?"حسب السنة":"حسب الشهر"}</div><div class="paper"><div class="pill-row"><button data-a="metric" data-v="n" aria-pressed="${ui.metric==="n"}">عدد الرحلات</button><button data-a="metric" data-v="k" aria-pressed="${ui.metric==="k"}">المسافة</button></div>${bars(items,max)}</div>`;
  const rt=s.routes.slice(0,4).map(([r,n])=>{const [a,b]=r.split("-");return `<li><div class="n"><span class="cds">${a} ⇄ ${b}</span><small>${esc(AP[a].city)} – ${esc(AP[b].city)}</small></div><span class="v">${n}×</span></li>`}).join("");
  const ap=s.aps.slice(0,4).map(([a,n])=>`<li><div class="n">${flag(AP[a].cc,22,15)}<span class="cds">${a}</span><small>${esc(AP[a].city)}</small></div><span class="v">${n}×</span></li>`).join("");
  const al=s.als.slice(0,4).map(([a,n])=>`<li><div class="n"><span class="cds">${a}</span><small>${esc(AIRLINES[a])}</small></div><span class="v">${n}×</span></li>`).join("");
  h+=`<div class="sec">أكثر المسارات</div><div class="paper"><ul class="top">${rt}</ul></div><div class="sec">أكثر المطارات</div><div class="paper"><ul class="top">${ap}</ul></div>`;
  if(al)h+=`<div class="sec">شركات الطيران</div><div class="paper"><ul class="top">${al}</ul></div>`;
  h+=`<div class="sec">أطول رحلة وأقصرها</div><div class="grid2"><div class="st"><b>${num(s.lg.k)}</b><span>كم · ${s.lg.f.from}→${s.lg.f.to} · ${esc(s.lg.f.no)}</span></div><div class="st"><b>${num(s.sh.k)}</b><span>كم · ${s.sh.f.from}→${s.sh.f.to} · ${esc(s.sh.f.no)}</span></div></div>`;
  return h;
}

function submitFlight(e){
  e.preventDefault();
  const id=e.target.dataset.id,no=$("#f-no").value.trim().toUpperCase().replace(/^([A-Z0-9]{2})\s*(\d)/,"$1 $2"),date=$("#f-date").value,from=$("#f-from").value,to=$("#f-to").value;
  const err=m=>{$("#err").textContent=m;return false};
  if(!/^[A-Z0-9]{2} ?\d{1,4}[A-Z]?$/.test(no))return err("اكتب رقم الرحلة بالشكل: رمز الشركة ثم الرقم، مثل SV 1051.");
  if(!date)return err("اختر تاريخ الرحلة.");
  if(!to)return err("اختر مطار الوصول.");
  if(from===to)return err("مطار الوصول يجب أن يختلف عن مطار الإقلاع.");
  let trip=$("#f-trip").value;
  if(!trip){const y=new Date(date).getFullYear(),home=AP[S.home].cc,dest=AP[to].cc!==home?AP[to]:AP[from];trip=`${dest.city} ${y}`}
  const o={id:id||("u"+Date.now().toString(36)),no,date,time:$("#f-time").value||"09:00",from,to,trip,status:$("#f-st").value,delay:+($("#f-dl").value||0),seat:$("#f-seat").value.trim(),gate:$("#f-gate").value.trim(),term:$("#f-term").value.trim()};
  if(o.status!=="delayed")o.delay=0;
  if(id)S.flights=S.flights.map(f=>f.id===id?o:f);else S.flights.push(o);
  S.sample=S.sample&&S.flights.every(f=>/^s\d+$/.test(f.id));

function genImg(i){return new Promise(res=>{
  const c=document.createElement("canvas");c.width=1200;c.height=800;const g=c.getContext("2d");
  const P=[["#f6a57a","#f7d7a0","#2f4f7f"],["#7fa7f2","#cfe4f6","#2d4ca3"],["#2b3a67","#f0a060","#1a2440"],["#9ad4c8","#f5efd2","#2c7a7b"],["#e8b4c8","#ffd7a8","#5b3a8c"],["#f0c36a","#f7e7b4","#7a4a2a"]][i%6];
  const gr=g.createLinearGradient(0,0,0,800);gr.addColorStop(0,P[0]);gr.addColorStop(.72,P[1]);g.fillStyle=gr;g.fillRect(0,0,1200,800);
  g.fillStyle=P[1];g.beginPath();g.arc(260+i*130,250,74,0,7);g.fill();
  g.fillStyle=P[2];g.globalAlpha=.55;g.beginPath();g.moveTo(0,800);g.lineTo(0,540);for(let x=0;x<=1200;x+=40)g.lineTo(x,500+Math.sin(x/120+i)*50);g.lineTo(1200,800);g.fill();g.globalAlpha=1;
  g.fillStyle=P[2];
  if(i%3===0){for(let k=0;k<3;k++){const x=420+k*190;g.fillRect(x-60,560,120,240);g.beginPath();g.arc(x,560,60,Math.PI,0);g.fill();g.fillRect(x-4,470,8,40)}}
  else if(i%3===1){for(let k=0;k<2;k++){const x=520+k*260;g.beginPath();g.moveTo(x,360);g.lineTo(x,700);g.lineTo(x+170,700);g.fill();g.fillRect(x-60,700,260,20)}}
  else{for(let k=0;k<2;k++){const x=300+k*560;g.fillRect(x,330,40,470);g.beginPath();g.moveTo(x-6,330);g.lineTo(x+20,250);g.lineTo(x+46,330);g.fill()}g.beginPath();g.arc(600,720,150,Math.PI,0);g.fill()}
  c.toBlob(b=>res({blob:b,w:1200,h:800}),"image/jpeg",.85)})}

  const j=await r.json(),pages=Object.values((j.query&&j.query.pages)||{});

  let b="";
  if(TRIPV.tab===0)b=fs.map(f=>{const d=depDate(f),[sk,sl]=statusOf(f);return `<div class="tl"><span class="bub b${d.getDate()%3+1}">${MONTHS[d.getMonth()]}<b>${d.getDate()}</b></span><button class="cardf" data-a="edit" data-id="${f.id}"><div class="cds">${f.from}<svg viewBox="0 0 24 24"><use href="#i-plane"/></svg>${f.to}</div><small>${esc(f.no)}${airline(f.no)?" · "+airline(f.no):""} · ${depTxt(f)} · ${num(km(f.from,f.to))} كم</small><span class="chip c-${sk}">${sl}</span></button></div>`}).join("");
  else if(TRIPV.tab===1)b=(posts.length?posts.map(p=>{const ex=(p.blocks.find(x=>x.t==="p"&&x.text)||{}).text||"",nn=photosOf(p).length;return `<button class="pc" data-a="openpost-t" data-id="${p.id}"><div class="cv" ${bg(coverOf(p))}></div><div class="in"><h3>${esc(p.title||"بدون عنوان")}</h3><p>${esc(ex)}</p><div class="mt"><span>${nn} صورة</span></div></div></button>`}).join(""):`<div class="empty"><h3>لا توجد تدوينات لهذه الرحلة</h3><p>اكتب عن الأماكن والأكل والصور.</p></div>`);
  else if(TRIPV.tab===2)b=photos.length?`<div class="alb">${photos.map((x,i)=>`<figure data-a="lb-trip" data-i="${i}"><img src="${mediaURL(x.id)}" alt="${esc(x.cap)}" loading="lazy">${x.cap?`<figcaption>${esc(x.cap)}</figcaption>`:""}</figure>`).join("")}</div>`:`<div class="empty"><h3>لا توجد صور بعد</h3><p>الصور التي تضيفها في تدويناتك لهذه الرحلة تظهر هنا.</p></div>`;
  else{
    const places=posts.flatMap(p=>p.blocks.filter(x=>x.t==="place"&&x.name).map(x=>({n:x.name,k:x.kind})));
    const cities=[...new Set(fs.flatMap(f=>[f.to]))].filter(c=>AP[c].cc!==home||fs.length===1);
    b=cities.map(c=>`<a class="pl" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(AP[c].name+" "+AP[c].city)}" target="_blank" rel="noopener">${ico("plane")}${esc(AP[c].city)} (${c})<small>${esc(AP[c].name)}</small></a>`).join("")+
      places.map(p=>`<a class="pl" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n+" "+AP[dest].city)}" target="_blank" rel="noopener">${ico("pin")}${esc(p.n)}<small>${esc(p.k||"")}</small></a>`).join("")||"";
    if(!places.length)b+=`<p class="note">أماكن تدويناتك (بطاقات المكان) تظهر هنا بروابط الخرائط.</p>`;
  }
  $("#ov").innerHTML=`<div class="ovw" id="ovw"><div class="app td"><div class="hero2"><svg class="sc scn" aria-hidden="true"><use href="#s-${sceneFor(dest)}"/></svg><div class="ph-img" data-wh="${dest}"></div>
   <div class="tb"><button class="circ" data-a="tdclose" aria-label="رجوع">${ico("arr")}</button><button class="circ" data-a="tdshare" aria-label="مشاركة">${ico("share")}</button></div>
   <div class="st0"><span class="chip glass"><i class="dot" style="width:8px;height:8px;border-radius:50%;background:${st[1]};display:inline-block"></i>${st[0]}</span></div>
   <div class="tt"><h1>${esc(n)}</h1><div>${ccs.map(c=>flag(c,22,15)).join("")}<span>${rng}</span><span>·</span><span>${fs.length} ${fs.length>1?"رحلات":"رحلة"} · ${num(tk)} كم</span></div></div></div>
   <div class="sh"><div class="tabs" role="group" aria-label="أقسام الرحلة">${T.map((t,i)=>`<button class="tab ${TRIPV.tab===i?"on":""}" data-a="tdtab" data-v="${i}" aria-pressed="${TRIPV.tab===i}">${ico(t[0])}${t[1]}</button>`).join("")}</div><div class="tbody">${b}</div></div></div>
   <div class="fab2"><button class="btn dark full" data-a="tdnew">${ico("plus")}إضافة ذكرى</button></div></div>`;
  $("#ovw").scrollTop=y;hydrateHero();
}
Object.assign(A,{
 trip(v){openTrip(decodeURIComponent(v))},
 tdclose(){closeOv()},
 tdtab(v){TRIPV.tab=+v;tripRender()},
 tdnew(){newPostSheet(TRIPV.name)},
 "openpost-t"(v,el){openPost(el.dataset.id)},
 "lb-trip"(v,el){openLB(TLIST,+el.dataset.i)},
 tdshare(){const n=TRIPV.name,fs=tripFlights(n),text=`رحلتي: ${n} — ${fs.length} رحلات · ${num(fs.reduce((a,f)=>a+km(f.from,f.to),0))} كم. خُطّطت في وجهة`;if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("تم نسخ نص الرحلة"),()=>toast(text))}
});

document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el,e)});
document.addEventListener("submit",e=>{if(e.target.id==="ff")submitFlight(e)});
document.addEventListener("change",e=>{
  if(e.target.id==="nm"){S.name=e.target.value.trim();save();render(1)}
  if(e.target.id==="home"){S.home=e.target.value;save();render(1)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML)$("#layer").innerHTML=""});
setInterval(()=>{const c=$("#cd");if(c){const f=S.flights.find(x=>x.id===c.dataset.id);if(f){const t=countdown(f);c.innerHTML=t?"تقلع بعد "+t:""}}},30000);
render();bootJournal();
</script>

</body>
</html>
