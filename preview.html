<style>:root{--desk:#D5DDE5;--paper:#FFFFFF;--ink:#14213D;--mu:#5E6B80;--green:#0A7B5C;--amber:#FFB400;--red:#C23B2E;--line:#C3CCD6;--chip:#EEF1F5;--seg:#C3CDD8;--ok-bg:#D6F0E7;--ok-tx:#075C45;--wa-bg:#FFEBB8;--wa-tx:#6B4A00;--no-bg:#F8D9D5;--no-tx:#8C241A;--r:16px}
:root[data-theme=dark]{--desk:#0F1722;--paper:#18222F;--ink:#EAF0F7;--mu:#93A1B4;--line:#33415A;--chip:#223044;--seg:#223044;--ok-bg:#12372F;--ok-tx:#5FE0B6;--wa-bg:#3A2F12;--wa-tx:#F0CB6A;--no-bg:#3F1B18;--no-tx:#F2A59B}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{background:var(--desk);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:16px;line-height:1.7;padding-bottom:96px}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.skip{position:absolute;inset-inline-start:-999px}.skip:focus{inset-inline-start:8px;top:8px;background:#fff;color:#000;padding:8px;z-index:99}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--desk)}
.brand{display:flex;gap:8px;align-items:center;font-size:19px}.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;background:var(--paper);font-weight:700;font-size:15px}
main{max-width:620px;margin:auto;padding:6px 16px 16px;animation:fade .2s}@keyframes fade{from{opacity:0}}
h1{font-size:28px;line-height:1.35;font-weight:700;margin:6px 0 4px}h2{font-size:19px;font-weight:700;margin:22px 0 10px}p{margin:6px 0}
.mu{color:var(--mu);font-size:14px}
.code{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.02em;direction:ltr;display:inline-block;line-height:1}
.big{font-size:54px}
/* pass */
.pass{position:relative;display:flex;background:var(--paper);border-radius:var(--r);margin-bottom:14px}
.pass .main{flex:1;padding:16px 18px;display:block}
.pass .stub{width:108px;padding:14px 10px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;gap:8px;order:-1;border-inline-start:2px dashed var(--line)}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--desk);inset-inline-end:calc(108px - 10px)}
.pass .stub::before{top:-10px}.pass .stub::after{bottom:-10px}
.eyebrow{font-size:12px;color:var(--mu);font-weight:500}.dest{font-size:20px;font-weight:700;line-height:1.3;margin-top:4px}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.5}
.t-ok{background:var(--ok-bg);color:var(--ok-tx)}.t-warn{background:var(--wa-bg);color:var(--wa-tx)}.t-bad{background:var(--no-bg);color:var(--no-tx)}
.heart{width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--red);background:var(--chip);transition:transform .15s}.heart[aria-pressed=true]{transform:scale(1.08)}
.bars{height:34px;width:100%;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px)}
.vpass{flex-direction:column}.vpass .main{padding:18px}
.route{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;direction:ltr}
.route .line{flex:1;border-top:2px dashed var(--line);margin:0 12px;position:relative;height:0}
.route .line::after{content:"✈";position:absolute;inset:-14px 0 auto;text-align:center;font-size:20px;background:var(--paper);width:34px;margin:auto}
.cities{display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;border-top:1px solid var(--line);padding-top:12px}
.facts b{display:block;font-size:15px;line-height:1.5}.facts span{font-size:12px;color:var(--mu)}
.seal{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 12px;font-weight:700;margin:12px 0}
.seal.ok{background:var(--green);color:#fff}.seal.warn{background:var(--amber);color:#2b1e00}.seal.bad{background:var(--red);color:#fff}
.btn{display:flex;justify-content:center;align-items:center;gap:6px;width:100%;min-height:54px;border-radius:14px;background:var(--ink);color:var(--desk);font-weight:700;font-size:17px;transition:transform .1s}
.btn:active{transform:scale(.98)}.btn.ghost{background:var(--paper);color:var(--ink)}.btn.sm{min-height:44px;width:auto;padding:0 18px;font-size:15px}
.actions{display:flex;gap:10px;margin:10px 0 4px}.actions .btn{flex:1}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;margin:12px 0 16px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mu)}
.seg [aria-selected=true],.seg [aria-pressed=true]{background:var(--paper);color:var(--ink)}
.field{background:var(--paper);border-radius:12px;padding:6px 14px;min-height:60px;display:flex;flex-direction:column;justify-content:center}
.field label{font-size:11px;color:var(--mu);font-weight:500;margin:0}
.field select,.field input{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;font-size:16px;min-height:30px;padding:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:14px;padding:4px 14px;margin:12px 0}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;min-height:48px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:99px;background:var(--paper);color:var(--ink);font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--desk);font-weight:700}
.slip{background:var(--paper);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.slip .who{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
.stars{color:var(--amber);letter-spacing:2px;font-size:18px}
.sum{display:flex;gap:16px;align-items:center}.sum .big{font-size:72px}
.tabs{display:flex;background:var(--seg);border-radius:12px;padding:3px;margin:14px 0}
.tab{flex:1;min-height:42px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mu)}.tab[aria-selected=true]{background:var(--paper);color:var(--ink)}
.list{list-style:none;padding:0;display:grid;gap:8px}.list li::before{content:"✓";color:var(--green);font-weight:700;margin-inline-end:10px}
.note{background:var(--wa-bg);color:var(--wa-tx);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px}.kv b{color:var(--mu);font-weight:500}
.panel{background:var(--paper);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hint{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--mu);font-size:14px}
.empty{text-align:center;padding:36px 10px;color:var(--mu)}
.day{border-inline-start:4px solid var(--amber);padding:6px 12px;margin:10px 0;background:var(--chip);border-radius:10px}
input,select,textarea{width:100%;min-height:48px;padding:10px 14px;border:0;border-radius:12px;background:var(--chip);color:var(--ink);font:inherit}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
.onb{min-height:68vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}.dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ink);width:40px}
.tabbar{position:fixed;bottom:12px;inset-inline:12px;max-width:420px;margin:auto;display:flex;background:var(--paper);border-radius:28px;padding:6px;box-shadow:0 10px 30px rgba(10,20,40,.22);z-index:20}
.tabbar a{flex:1;min-height:56px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);font-size:11px}
.tabbar a i{font-style:normal;font-size:20px;line-height:1.1}.tabbar a.on{background:var(--ink);color:var(--desk);font-weight:700}
.toast{position:fixed;bottom:96px;inset-inline:16px;margin:auto;max-width:340px;background:var(--ink);color:var(--desk);padding:12px 16px;border-radius:14px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--wa-bg);color:var(--wa-tx)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.crow{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:10px 14px;margin-bottom:8px;min-height:60px}
.crow .code{font-size:26px;width:58px;flex:none;color:var(--ink)}.crow .cn{flex:1;display:flex;flex-direction:column;line-height:1.35}.crow small{color:var(--mu);font-size:12px}
.crow .chev{color:var(--mu);font-size:22px}.crow:active{transform:scale(.99)}
.mstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.mstrip span{text-align:center;padding:6px 2px;border-radius:8px;background:var(--chip);color:var(--mu);font-size:13px}
.mstrip span.on{background:var(--green);color:#fff;font-weight:700}
a.chip{display:flex;align-items:center;gap:4px}
.doc{display:flex;gap:12px;align-items:center;min-height:44px;padding:2px 0;cursor:pointer;margin:0;font-weight:400;font-size:16px}
.doc input{width:22px;height:22px;min-height:0;padding:0;flex:none;accent-color:var(--green);background:none}
.doc.done span{color:var(--mu);text-decoration:line-through}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:4px 0 8px}.prog i{display:block;height:100%;width:var(--w);background:var(--green);border-radius:3px;margin-inline-start:0;transition:width .25s}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cmp .ch{background:var(--paper);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start}.cmp .ch .code{font-size:34px}
.cmp .cl{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--mu);margin-top:8px}
.cmp .cc{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:15px;min-width:0;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.mini span{font-size:10px;text-align:center;padding:3px 0;border-radius:5px;background:var(--chip);color:var(--mu)}.mini span.on{background:var(--green);color:#fff;font-weight:700}
.actions .btn{font-size:14px;padding:0 10px}
</style>

   <p class="mu">روابط تجريبية — تُستبدل بروابط الشركاء. قد نحصل على عمولة.</p></div>`;
  if(tab==='rev'){const avg=(rv.reduce((a,x)=>a+x.s,0)/(rv.length||1)).toFixed(1);
   body=`<div class="pass vpass"><div class="main"><div class="sum"><div><div class="code big" style="font-size:72px">${rv.length?avg:'—'}</div><div class="stars" aria-hidden="true">★★★★★</div><div class="eyebrow">${rv.length} مراجعة</div></div></div></div></div>
   ${rv.map(x=>`<article class="slip"><div class="who"><span>المسافر: ${esc(x.n)}</span></div><div class="stars" aria-label="${x.s} من 5">${'★'.repeat(x.s)}${'☆'.repeat(5-x.s)}</div><p>${esc(x.t)}</p></article>`).join('')||'<div class="hint">كن أول من يكتب مراجعة.</div>'}
   <form id="rf" class="panel"><label for="rt">مراجعتك</label><textarea id="rt" rows="3" required maxlength="300"></textarea><label for="rs">التقييم</label><select id="rs"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><button class="btn" style="margin-top:12px">اكتب مراجعتك</button></form>`}
  main.innerHTML=`<div class="row" style="display:flex;justify-content:space-between;align-items:center"><div><h1>${nm(d)}</h1><div class="mu">${[d.city,d.flight?'✈️ '+ar(d.flight):'',d.rating?'★ '+ar(d.rating):''].filter(Boolean).join(' · ')}</div></div><div style="display:flex;gap:8px"><button class="heart" id="share" style="color:var(--ink)" aria-label="مشاركة">⤴</button>${heart(d)}</div></div>
  <div class="tabs" role="tablist">${Object.entries(T3).map(([k,v])=>`<button role="tab" class="tab" data-tab="${k}" aria-selected="${k===tab}">${v}</button>`).join('')}</div>${body}
  <div class="actions"><button class="btn" id="addtrip">＋ أضف إلى رحلتي</button><button class="btn ghost" id="alert">🔔 نبّهني</button><button class="btn ghost" id="cmp">⚖️ قارن</button></div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>views.detail(id,b.dataset.tab));
  main.querySelectorAll('[data-doc]').forEach(c=>c.onchange=()=>{let done=store.get('docs_'+id,[]);const i=+c.dataset.doc;done=c.checked?[...new Set([...done,i])]:done.filter(x=>x!==i);store.set('docs_'+id,done);c.closest('.doc').classList.toggle('done',c.checked);$('#dprog').textContent=`جهّزت ${ar(done.length)} من ${ar(r.docs.length)}`;$('#dbar').style.setProperty('--w',Math.round(done.length/Math.max(1,r.docs.length)*100)+'%')});
  $('#share').onclick=async()=>{const url=location.href.split('#')[0]+'#/d/'+id,text=`${nm(d)}: ${SEAL[r.visa]} بجواز سعودي${r.reviewed?'':' (غير موثّقة رسميًا، تأكد من الجهة الرسمية)'} — سفرنا`;try{if(navigator.share){await navigator.share({title:nm(d)+' — سفرنا',text,url})}else{await navigator.clipboard.writeText(text+'\n'+url);toast('نُسخ الرابط')}}catch{try{await navigator.clipboard.writeText(text+'\n'+url);toast('نُسخ الرابط')}catch{toast('تعذّرت المشاركة')}}};
  $('#cmp').onclick=()=>{location.hash='#/compare/'+id};
  $('#addtrip').onclick=()=>{const t=store.get('trips',[]);t.push({id:Date.now(),d:id,start:'',days:5,plan:[]});store.set('trips',t);toast('أُضيفت إلى رحلاتي')};
  $('#alert').onclick=async()=>{const a=store.get('alerts',[]);if(!a.includes(id))a.push(id);store.set('alerts',a);if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();toast('سننبهك عند تغيّر شروط '+d.ar)};
  $('#rf')?.addEventListener('submit',async e=>{e.preventDefault();const body=$('#rt').value.trim(),rating=+$('#rs').value;
   if(apiOn&&store.get('token')){try{await api('/destinations/'+id+'/reviews',{method:'POST',body:{rating,body}});toast('استلمنا مراجعتك وستظهر بعد المراجعة');$('#rt').value='';return}catch(err){toast(err.status===401?'سجّل الدخول من «الأدوات» أولًا':'تعذّر الإرسال: '+err.message);return}}
   const l=store.get('reviews',[]);l.unshift({d:id,n:'أنت',s:rating,t:body});store.set('reviews',l);toast('نُشرت مراجعتك');views.detail(id,'rev')})},
 calendar(){
  main.innerHTML=`<h1>مواسم السفر</h1><p class="mu">الإجازات والأعياد في السعودية، لتختار وقت سفرك قبل الازدحام وارتفاع الأسعار.</p><div id="evs"><div class="hint">جارٍ التحميل…</div></div>
  <p class="note">⚠️ تواريخ الأعياد محسوبة من تقويم أم القرى وقد تختلف يومًا أو أكثر عن الإعلان الرسمي. الإجازات الرسمية غالبًا أطول من أيام العيد نفسها. «مؤكد» تعني أن محررًا أكّد الموعد.</p>`;
  loadCal().then(ev=>{const l=ev.filter(e=>e.end>=todayIso()).sort((a,b)=>a.start.localeCompare(b.start));
   $('#evs').innerHTML=l.map(e=>{const d=dayDiff(todayIso(),e.start),single=e.start===e.end;const rng=single?fdate(e.start):`${fdate(e.start)} — ${fdate(e.end)}`;const mo=+e.start.slice(5,7);
    return `<article class="slip"><div class="who"><span>${d>0?'بعد '+ar(d)+' يومًا':'الآن'}</span><span class="tag ${e.confirmed?'t-ok':'t-warn'}">${e.confirmed?'مؤكد':'تقديري'}</span></div>
    <b class="dest" style="display:block">${esc(e.name)}</b><p class="mu" style="margin:2px 0">${rng}${e.hijri?` · ${esc(e.hijri)}`:''}</p>${e.note?`<p style="font-size:14px">${esc(e.note)}</p>`:''}
    <button class="btn ghost sm" data-mo="${mo}" style="margin-top:6px">🗓️ وجهات مناسبة لشهر ${MONTHS[mo-1]}</button></article>`}).join('')||'<div class="hint">لا أحداث قادمة. تُضاف من لوحة الإدارة.</div>';
   main.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{state.month=+b.dataset.mo;location.hash='#/explore'})});},
 compare(aId,bId){
  const list=[...dests].sort((x,y)=>x.ar.localeCompare(y.ar,'ar'));
  const A=byId(aId)||byId('tr')||list[0];const B=byId(bId)&&bId!==A.id?byId(bId):(['ae','ge','jp','gb'].map(byId).find(d=>d&&d.id!==A.id)||list.find(d=>d.id!==A.id));
  const sel=(id,name)=>`<div class="field"><label for="${name}">${name==='ca'?'الوجهة الأولى':'الوجهة الثانية'}</label><select id="${name}">${list.map(d=>`<option value="${d.id}" ${d.id===id?'selected':''}>${d.emoji||''} ${d.ar}</option>`).join('')}</select></div>`;
  const cell=(f)=>`<div class="cc">${f(A)}</div><div class="cc">${f(B)}</div>`;
  const row=(label,f)=>`<div class="cl">${label}</div>${cell(f)}`;
  const mini=d=>{const ms=monthsOf(d);return ms.length?`<div class="mini" role="img" aria-label="أفضل الأشهر: ${ms.map(m=>MONTHS[m-1]).join('، ')}">${MONTHS.map((n,i)=>`<span class="${ms.includes(i+1)?'on':''}">${n.slice(0,3)}</span>`).join('')}</div>`:'<span class="mu">لا بيانات</span>'};
  const ea=ORDER[A.req.visa],eb=ORDER[B.req.visa];
  const verdict=ea===eb?'الوجهتان متقاربتان في سهولة الدخول.':`الأسهل دخولًا: <b>${(ea<eb?A:B).emoji||''} ${nm(ea<eb?A:B)}</b>`;
  main.innerHTML=`<h1>قارن وجهتين</h1><div class="two">${sel(A.id,'ca')}${sel(B.id,'cb')}</div>
  <div class="panel" style="padding:12px 14px">${verdict}<div class="mu" style="font-size:12px;margin-top:2px">المقارنة بحسب نوع الدخول فقط، وليست توصية بالسفر.</div></div>
  <div class="cmp"><div class="ch"><span class="code">${A.iata}</span><b>${nm(A)}</b></div><div class="ch"><span class="code">${B.iata}</span><b>${nm(B)}</b></div>
  ${row('الدخول',d=>`${tag(d)}<div class="mu" style="font-size:13px;margin-top:4px">${SEAL[d.req.visa]}</div>`)}
  ${row('مدة الإقامة',d=>d.req.stay?ar(d.req.stay)+' يومًا':'غير محددة')}
  ${row('صلاحية الجواز',d=>d.req.passport?esc(ar(d.req.passport)):'تحقق من المصدر')}
  ${row('المستندات',d=>`<ul class="list" style="font-size:13px;gap:4px">${d.req.docs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`)}
  ${row('التطعيم والحجر',d=>`${esc(d.req.vaccines||'غير محدد')}<br><span class="mu">${esc(d.req.quarantine||'')}</span>`)}
  ${row('أفضل الأشهر',mini)}
  ${row('مدة الطيران',d=>d.flight?ar(d.flight):'—')}
  ${row('الميزانية',d=>d.budget?bud(d.budget):'—')}
  ${row('موثّقة رسميًا؟',d=>d.req.reviewed?'✓ راجعها محرر':'غير موثّقة رسميًا')}</div>
  <div class="actions"><a class="btn ghost" href="#/d/${A.id}">تفاصيل ${nm(A)}</a><a class="btn ghost" href="#/d/${B.id}">تفاصيل ${nm(B)}</a></div>`;
  const go=()=>{location.hash=`#/compare/${$('#ca').value}/${$('#cb').value}`};$('#ca').onchange=go;$('#cb').onchange=go},
 saved(){const all=favs().map(byId).filter(Boolean);
  const l=all.filter(d=>state.fav==='all'||(state.fav==='free'?['free','gcc'].includes(d.req.visa):!['free','gcc'].includes(d.req.visa)));
  main.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:end"><h1>المفضلة</h1><span class="mu">${all.length} وجهات</span></div>
  <div class="seg" role="group" aria-label="تصفية">${[['all','الكل'],['free','بدون تأشيرة'],['need','تحتاج تأشيرة']].map(([k,v])=>`<button data-f="${k}" aria-pressed="${state.fav===k}">${v}</button>`).join('')}</div>
  ${l.map(passCard).join('')}<div class="hint">${all.length?'':'لم تحفظ أي وجهة بعد. '}اضغط ♡ في أي وجهة لتظهر هنا، وتبقى متاحة بدون إنترنت.</div>`;
  main.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{state.fav=b.dataset.f;views.saved()})},
 trips(){const t=store.get('trips',[]);
  main.innerHTML=`<h1>رحلاتي</h1>${t.map(x=>{const d=byId(x.d);return `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><b class="dest">${d.ar} <span class="code" style="font-size:22px">${d.iata}</span></b><button class="icon-btn" data-del="${x.id}" aria-label="حذف الرحلة">🗑️</button></div>
   <div class="two"><div><label for="s${x.id}">تاريخ السفر</label><input type="date" id="s${x.id}" value="${x.start}" data-k="start" data-i="${x.id}"></div>
   <div><label for="n${x.id}">الأيام</label><input type="number" min="1" max="30" id="n${x.id}" value="${x.days}" data-k="days" data-i="${x.id}"></div></div>
   ${Array.from({length:x.days},(_,i)=>`<div class="day"><b>اليوم ${i+1}</b><input aria-label="خطة اليوم ${i+1}" placeholder="مثال: زيارة المعالم…" value="${esc(x.plan[i]||'')}" data-plan="${i}" data-i="${x.id}"></div>`).join('')}
   ${x.start&&!['free','gcc'].includes(d.req.visa)?`<p class="note">🛂 تذكير: ابدأ إجراءات الدخول (${D.visaLabels[d.req.visa].ar}) قبل السفر بوقت كافٍ.</p>`:''}</div>`}).join('')||'<div class="hint">لا رحلات بعد. افتح أي وجهة واضغط «أضف إلى رحلتي».</div>'}`;
  main.oninput=e=>{const el=e.target,i=el.dataset.i;if(!i)return;const all=store.get('trips',[]),x=all.find(y=>y.id==i);if(el.dataset.k)x[el.dataset.k]=el.dataset.k==='days'?Math.min(30,Math.max(1,+el.value||1)):el.value;if(el.dataset.plan!==undefined)x.plan[el.dataset.plan]=el.value;store.set('trips',all)};
  main.onchange=e=>{if(e.target.dataset.k==='days')views.trips()};
  main.onclick=e=>{const b=e.target.closest('[data-del]');if(b){store.set('trips',store.get('trips',[]).filter(x=>x.id!=b.dataset.del));views.trips()}}},
 tools(){const cur=Object.keys(D.ratesPerSAR);
  main.innerHTML=`<h1>الأدوات</h1><div class="panel"><h2 style="margin-top:0">💱 محوّل العملات</h2>
  <label for="amt">المبلغ</label><input id="amt" type="number" inputmode="decimal" value="1000">
  <div class="two"><div><label for="from">من</label><select id="from">${cur.map(c=>`<option ${c==='SAR'?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="to">إلى</label><select id="to">${cur.map(c=>`<option ${c==='TRY'?'selected':''}>${c}</option>`).join('')}</select></div></div>
  <p class="code" id="res" style="font-size:34px;margin:10px 0" aria-live="polite"></p><p class="mu" id="src"></p></div>
  <div class="panel"><h2 style="margin-top:0">🔔 التنبيهات</h2><p class="mu">تنبيهات عند تغيّر شروط الدخول للوجهات المتابَعة.</p>
  <p>الوجهات المتابَعة: ${store.get('alerts',[]).map(i=>byId(i)?.ar).join('، ')||'لا شيء'}</p>
  <label for="em">البريد للتنبيهات</label><input id="em" type="email" placeholder="name@example.com" value="${esc(store.get('email',''))}"><button class="btn" id="pushbtn" style="margin-top:10px">تفعيل التنبيهات</button></div>
  ${apiOn?`<div class="panel" id="acct"><h2 style="margin-top:0">👤 الحساب</h2>${store.get('token')?`<p>أنت مسجّل الدخول بـ <b>${esc(store.get('email','')) }</b>. تُزامَن مفضلتك مع حسابك.</p><button class="btn ghost" id="logout">تسجيل الخروج</button>`:`<p class="mu">سجّل لتحفظ المفضلة وتكتب المراجعات.</p><label for="ae">البريد</label><input id="ae" type="email" autocomplete="email"><label for="ap">كلمة المرور (٨ أحرف على الأقل)</label><input id="ap" type="password" autocomplete="current-password" minlength="8"><div class="actions"><button class="btn" id="login">دخول</button><button class="btn ghost" id="signup">حساب جديد</button></div><p class="mu" id="aerr" role="alert"></p>`}</div>`:''}<div class="panel"><h2 style="margin-top:0">⚙️ الإعدادات</h2><div class="actions"><button class="btn ghost" id="reset">إعادة الإعداد الأولي</button><a class="btn ghost" href="admin.html">لوحة الإدارة</a></div></div>`;
  let rates={...D.ratesPerSAR};
  const calc=()=>{const a=+$('#amt').value||0,f=$('#from').value,t=$('#to').value;$('#res').textContent=(a/rates[f]*rates[t]).toLocaleString('en',{maximumFractionDigits:2})+' '+t};
  ['amt','from','to'].forEach(i=>$('#'+i).oninput=calc);calc();$('#src').textContent='أسعار تقريبية (دون اتصال)';
  fetch('https://open.er-api.com/v6/latest/SAR').then(r=>r.json()).then(j=>{if(j.rates){cur.forEach(c=>{if(j.rates[c])rates[c]=j.rates[c]});store.set('rates',rates);calc();$('#src').textContent='أسعار مباشرة · '+new Date().toLocaleDateString('ar-SA')}}).catch(()=>{const c=store.get('rates');if(c){rates=c;calc();$('#src').textContent='آخر أسعار محفوظة'}});
  $('#pushbtn').onclick=async()=>{store.set('email',$('#em').value);if('Notification'in window){const p=await Notification.requestPermission();toast(p==='granted'?'تم تفعيل التنبيهات':'لم يُمنح الإذن')}else toast('المتصفح لا يدعم التنبيهات')};
  $('#reset').onclick=()=>{store.set('onboarded',false);location.hash='#/welcome'};
  const auth=async path=>{const email=$('#ae').value.trim(),password=$('#ap').value;try{const j=await api(path,{method:'POST',body:{email,password}});store.set('token',j.token);store.set('email',j.user.email);
    const server=(await api('/me/favorites')).items.map(x=>x.id),local=favs(),all=[...new Set([...server,...local])];for(const id of local.filter(x=>!server.includes(x)))await api('/me/favorites/'+id,{method:'PUT'}).catch(()=>{});store.set('favs',all);toast('تم تسجيل الدخول');views.tools()}catch(err){$('#aerr').textContent=err.status===401?'البريد أو كلمة المرور غير صحيحة.':err.status===409?'هذا البريد مسجّل مسبقًا. اضغط «دخول».':err.status===400?'تحقق من البريد وأن كلمة المرور ٨ أحرف على الأقل.':'تعذّر الاتصال. حاول مرة أخرى.'}};
  $('#login')&&($('#login').onclick=()=>auth('/auth/login'));$('#signup')&&($('#signup').onclick=()=>auth('/auth/register'));
  $('#logout')&&($('#logout').onclick=()=>{store.set('token',null);toast('تم تسجيل الخروج');views.tools()})}
};
function route(){document.title='سفرنا — دليل المسافر السعودي';if(apiOn&&Date.now()-lastFetch>60000)refresh();const h=location.hash.replace(/^#\/?/,'').split('/'),r=h[0]||'home';
  document.querySelectorAll('.tabbar a').forEach(a=>a.classList.toggle('on',a.dataset.r===(r==='d'?'explore':r)));
 document.querySelector('.tabbar').hidden=r==='welcome';
 if(r==='welcome')views.onboarding();else if(r==='d')views.detail(h[1]);else if(r==='compare')views.compare(h[1],h[2]);else (views[r]||views.home)();
 window.scrollTo(0,0);main.focus({preventScroll:true})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fav]');if(!b)return;e.preventDefault();
 let f=favs();const id=b.dataset.fav;f=f.includes(id)?f.filter(x=>x!==id):[...f,id];store.set('favs',f);if(apiOn&&store.get('token'))api('/me/favorites/'+id,{method:f.includes(id)?'PUT':'DELETE'}).catch(()=>{});toast(f.includes(id)?'أُضيفت إلى المفضلة':'أُزيلت من المفضلة');const y=scrollY;route();scrollTo(0,y)});
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';store.set('lang',lang);applyLang();route()};
$('#themeBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const off=()=>$('#offline').hidden=navigator.onLine;addEventListener('online',off);addEventListener('offline',off);off();
theme(store.get('theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));applyLang();
addEventListener('hashchange',route);route();
let lastFetch=0;
const refresh=()=>{if(!location.protocol.startsWith('http'))return;lastFetch=Date.now();api('/destinations?limit=300').then(j=>{if(!j?.items?.length)return;const changed=!apiOn||JSON.stringify(j.items)!==JSON.stringify(dests);dests=j.items;apiOn=true;if(changed&&!document.activeElement?.matches('input,textarea,select'))route()}).catch(()=>{})};
refresh();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastFetch>30000)refresh()});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
