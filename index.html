<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="description" content="36 بطاقة إجراءات للإسعافات الأولية وطوارئ المنزل والطريق والبر، خطوة بخطوة وبالصوت، تعمل بدون إنترنت.">
<meta name="theme-color" content="#16224B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<div class="app" id="app">
  <section class="welcome" id="welcome" hidden aria-label="مرحباً"></section>

  <div class="shell" id="shell">
    <header class="hdr" id="hdr"></header>
    <main class="main" id="main" tabindex="-1"></main>
    <nav class="nav" id="nav" aria-label="التنقل الرئيسي"></nav>
  </div>

  <div id="sheet" class="scrim" hidden></div>
  <div id="toasts" role="status" aria-live="polite"></div>
</div>

<dialog id="keyDlg">
  <form method="dialog">
    <h3 style="margin:0">مفتاح Gemini API</h3>
    <p class="sub">يُحفظ على جهازك فقط ويُرسل إلى Google عند التوليد.</p>
    <label for="keyInput" class="sr">المفتاح</label>
    <input id="keyInput" type="password" placeholder="AIza…" autocomplete="off">
    <div style="display:flex;gap:8px"><button class="btn blue" style="flex:1" value="save">حفظ</button><button class="btn ghost" style="flex:1" value="cancel">إلغاء</button></div>
  </form>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
