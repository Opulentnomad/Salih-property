# Render Blueprint — New + > Blueprint ثم اختر المستودع. تحقق من الصيغة في توثيق Render لأنها قد تتغير.
services:
  - type: web
    name: safarna
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: starter          # القرص الدائم (SQLite) يحتاج خطة مدفوعة
    disk:
      name: safarna-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false         # تُدخل قيمتها في لوحة Render
      - key: ADMIN_PASSWORD
        sync: false
