# Builds an installable debug APK and keeps it PRIVATE: it is stored only as a workflow
# artifact, downloadable by people with access to this repository (Actions tab -> run -> Artifacts).
name: Build APK

on:
  push:
    branches: [ "main", "claude/arabic-english-duolingo-app-4uzyhq" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Uses a pinned Gradle install instead of the wrapper jar, so the build works even if
      # the binary wrapper jar is missing from the repository.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and build debug APK
        run: gradle :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rihla-english-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
